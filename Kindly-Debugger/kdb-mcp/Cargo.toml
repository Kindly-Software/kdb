[package]
name = "kdb-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Samuel <samuel@primitives.dev>"]
description = "T6 Mixed MCP debugging server for kdb (Kindly Debugger) with 256KB orchestration capsule (<10μs latency)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/kdb-mcp"
keywords = ["mcp", "debugger", "capsule", "lockfree", "simd", "kdb"]
categories = ["development-tools::debugging", "development-tools::build-utils"]

[dependencies]
# Core dependencies
atomic_capsule = { version = "0.9", path = "../../atomic_capsule", features = ["std", "native", "histogram", "http-simd", "cache", "probabilistic", "streaming-stats", "circuit-breaker-standard64"] }
atomic_capsule_derive = { version = "0.9", path = "../../atomic_capsule_derive" }
kdb = { version = "0.1", path = "../kdb", features = ["std", "simd", "operator-challenge"] }

# JSON-RPC serialization (minimal deps)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Distributed Tracing (Phase 2B)
opentelemetry = { version = "0.21", optional = true }
opentelemetry_sdk = { version = "0.21", optional = true }
opentelemetry-jaeger = { version = "0.20", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }

# Security/Crypto (Phase 2A)
ring = { version = "0.17", optional = true }
hmac = { version = "0.12", optional = true }
subtle = { version = "2.5", optional = true }  # Constant-time comparison (SOTA 2024-2025 timing attack defense)
hkdf = { version = "0.12", optional = true }
zeroize = { version = "1.7", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
base32 = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
flate2 = { version = "1.0", optional = true }

# Collections (Phase 2C)
dashmap = { version = "5.5", optional = true }
memmap2 = { version = "0.9", optional = true }

# Binary path detection (for client auto-configuration)
which = { version = "6.0", optional = true }

# Fast random number generation for session IDs (MCP Streamable HTTP)
fastrand = "2.0"

# HTTP client for stdio->HTTP bridge (client feature)
ureq = { version = "2.9", optional = true }

# OAuth 2.1 + Google (Phase 3)
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1.0", features = ["rt", "macros"], optional = true }
jsonwebtoken = { version = "9.0", optional = true }
base64 = { version = "0.22", optional = true }
urlencoding = { version = "2.1", optional = true }

# PKCS#11 HSM Integration (Phase 5)
cryptoki = { version = "0.6", optional = true }

# BLAKE3 cryptographic hash for tamper-evident audit trails (Q34 compliance)
# - Auto-detects SIMD: AVX-512 > AVX2 > SSE4.1 > NEON > scalar
# - 2-8× faster than SHA-256, cryptographically secure (collision resistant)
blake3 = { version = "1.5", optional = true }

# REMOVED: tokio dependency replaced with atomic_capsule native async runtime
# Async runtime (native atomic_capsule, 10-20× faster, 100% lockfree)

# Linux-specific dependencies (for security validation)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Full security stack enabled by default (hosted black-box service)
# All 9 security layers active: encryption, access control, rate limiting, audit, zero-trust
default = [
    "std", "json-rpc", "memory-encryption", "access-control",
    "operator-challenge", "rate-limiting", "intrusion-detection",
    "audit", "zero-trust"
]

# Minimal build (development/testing only, NOT for production)
minimal = ["std", "json-rpc"]

# Alias for documentation clarity
secure-defaults = [
    "std", "json-rpc", "memory-encryption", "access-control",
    "operator-challenge", "rate-limiting", "intrusion-detection",
    "audit", "zero-trust"
]

# Standard library support
std = []

# JSON-RPC support for MCP protocol
json-rpc = ["serde", "serde_json"]

# Phase 2A: Security & Authentication Features
api-key-auth = ["std", "dashmap", "sha2", "rand"]
auth-guard = ["std"]
auth-token = ["std", "ring", "hmac"]
totp = ["std", "ring", "hmac", "sha1", "base32", "rand", "zeroize", "subtle"]  # subtle: SOTA constant-time comparison
access-control = ["std"]
operator-challenge = ["std", "access-control"]  # Forward to kdb's operator-challenge
zero-trust = ["std", "auth-token", "session"]
capability-checker = ["std"]
dynamic-pid = ["std"]
secrets = ["std", "ring", "hmac", "hkdf", "zeroize", "chacha20poly1305", "argon2", "rand", "memmap2"]
memory-encryption = ["std", "ring", "zeroize", "chacha20poly1305", "hkdf", "sha2", "rand"]
hsm = ["std", "cryptoki"]
key-rotation = ["std", "ring"]
tls = ["std", "ring"]
acme = ["std"]
intrusion-detection = ["std"]
anomaly-detection = ["std"]
session = ["std", "dashmap"]

# Phase 2B: Observability & Monitoring Features
metrics = ["std"]
tracing = ["std", "opentelemetry", "opentelemetry_sdk", "opentelemetry-jaeger", "tracing-subscriber", "tracing-opentelemetry"]
audit = ["std", "blake3"]
audit-rotation = ["std"]
rate-limiting = ["std", "dashmap"]

# Feature aliases (for code compatibility)
secrets-manager = ["secrets"]
totp-2fa = ["totp"]
per-client-rate-limiter = ["rate-limiting"]
hsm-integration = ["hsm"]
crypto-license = ["std"]
json-export = ["json-rpc"]
distributed-tracing = ["tracing"]
derive = []

# OAuth 2.1 authentication with Google
oauth = ["std", "reqwest", "tokio", "jsonwebtoken", "base64", "urlencoding", "sha2", "ring"]

# Google OAuth specific
google-oauth = ["oauth"]

# Full authentication suite
full-auth = ["oauth", "google-oauth", "api-key-auth", "auth-guard"]

# Phase 2C: Infrastructure & Transport Features (MIGRATED to atomic_capsule native runtime)
runtime = ["std", "atomic-capsule-runtime"]
http-transport = ["std", "atomic-capsule-runtime"]
stdio-transport = ["std", "atomic-capsule-runtime"]

# Native async runtime features (atomic_capsule)
atomic-capsule-runtime = ["std"]
connection-pool = ["std"]
sse-transport = ["std"]

# MCP Streamable HTTP transport (2025-06-18 spec)
streamable-http = ["std", "json-rpc"]

# Multi-source configuration resolution (T0 Auditable, Q34 audit trail)
configure = ["std", "which"]
# Auto-configure alias (same as configure, for clarity in documentation)
auto-configure = ["configure"]
# Full auto-configuration with config format support
auto-configure-full = ["auto-configure", "json-rpc"]

shared-state = ["std", "memmap2"]
tool-executor = ["std"]
feature-flags = ["std"]
ab-testing = ["std"]

# All features (MIGRATED to native async runtime)
all = ["std", "json-rpc", "api-key-auth", "auth-guard", "auth-token", "totp", "access-control", "operator-challenge", "zero-trust", "capability-checker", "dynamic-pid", "secrets", "memory-encryption", "hsm", "key-rotation", "tls", "acme", "intrusion-detection", "anomaly-detection", "session", "metrics", "tracing", "audit", "audit-rotation", "rate-limiting", "runtime", "http-transport", "stdio-transport", "sse-transport", "connection-pool", "shared-state", "tool-executor", "feature-flags", "ab-testing"]

# =============================================================================
# CLIENT-SIDE FEATURES (for kdb-mcp-client and third-party integrations)
# =============================================================================

# Phase 1: Essential Resilience (ACTIVE)
client = ["std", "client-metrics", "client-retry", "client-circuit-breaker", "ureq"]
client-metrics = ["std"]
client-retry = ["std"]
client-circuit-breaker = ["std"]

# Phase 2: Performance (coming soon)
client-cache = ["std"]
client-dedup = ["std"]

# Phase 3: Advanced (coming soon)
client-offline = ["std"]
client-batching = ["std"]

# Phase 4: Protection
# Note: crypto-license excluded due to unrelated issue in zero_trust_policy.rs
# P0ProtectionLayer uses FNV-1a based license validation internally
client-protection = ["std", "anti-debug", "emulator-detection"]

# Client feature bundles (hierarchical)
client-minimal = ["client-metrics", "client-retry", "client-circuit-breaker"]
client-standard = ["client-minimal", "client-cache", "client-dedup"]
client-full = ["client-standard", "client-offline", "client-batching", "client-protection"]

# Protection features (used by client-protection)
anti-debug = ["std"]
emulator-detection = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.test]
# Test all features enabled
opt-level = 1

[[example]]
name = "mcp_server_demo"
path = "examples/mcp_server_demo.rs"
required-features = ["std", "json-rpc"]

[[bench]]
name = "b32_mcp_latency"
path = "benches/b32_mcp_latency.rs"
required-features = ["std", "json-rpc"]
harness = false

[[bench]]
name = "b32_xpath_cache"
path = "benches/b32_xpath_cache.rs"
harness = false

[[bench]]
name = "b32_xml_parser"
path = "benches/b32_xml_parser.rs"
harness = false

[[bench]]
name = "b32_persistent_cache"
path = "benches/b32_persistent_cache.rs"
harness = false

[[bin]]
name = "kdb-mcp-server"
path = "src/bin/mcp_debug_server.rs"
required-features = ["std", "json-rpc", "runtime", "stdio-transport", "tool-executor", "atomic-capsule-runtime"]

[[bin]]
name = "kdb-mcp-http-server"
path = "src/bin/mcp_http_server.rs"
required-features = ["std", "json-rpc", "runtime", "http-transport", "tool-executor", "atomic-capsule-runtime"]

[[bin]]
name = "mcp_sse_server"
path = "src/bin/mcp_sse_server.rs"
required-features = ["std", "json-rpc", "sse-transport", "streamable-http", "http-transport", "oauth"]

[[bin]]
name = "kdb_client_bridge"
path = "src/bin/kdb_client_bridge.rs"
# Phase 3 features (client-offline, client-batching) are optional via conditional compilation
required-features = ["std", "client", "client-metrics", "client-retry", "client-circuit-breaker", "client-cache", "client-dedup"]

[[bin]]
name = "kdb_sse_bridge"
path = "src/bin/kdb_sse_bridge.rs"
required-features = ["std", "client"]

[[bin]]
name = "kdb_configure"
path = "src/bin/kdb_configure.rs"
required-features = ["configure", "std", "json-rpc", "client", "client-protection"]

[[bin]]
name = "kdb_handler"
path = "src/bin/kdb_handler.rs"
required-features = ["std"]

[dev-dependencies]
proptest = "1.4"
fastrand = "2.0"
tempfile = "3.10"
ed25519-dalek = "2.0"  # For access_control full flow test

# Enable all features for test targets
[package.metadata.docs.rs]
all-features = true
