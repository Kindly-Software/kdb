# Nginx Configuration for atomic_mcp_server (T8 Network TLS Termination)
#
# This configuration demonstrates TLS termination via nginx reverse proxy,
# achieving 0ns application overhead in the atomic_mcp_server (MCP tier: T8 Network).
#
# Deployment Strategy:
# 1. nginx listens on 443 (TLS 1.3, Let's Encrypt certificate)
# 2. atomic_mcp_server listens on plaintext 127.0.0.1:5678 (Unix loopback only)
# 3. nginx proxies all requests to localhost:5678
#
# Performance Impact:
# - TLS handshake: 0ns for application (handled by nginx/OpenSSL)
# - Per-request overhead: <1μs (proxy overhead, negligible)
# - Total latency: Still <10μs end-to-end (dominated by MCP RPC logic)
#
# Security:
# - TLS 1.3 only (no legacy TLS 1.2)
# - ECDHE key exchange (forward secrecy)
# - HSTS preload (strict-transport-security)
# - Certificate auto-renewal (certbot integration)

# ==============================================================================
# Main nginx Configuration (nginx.conf, /etc/nginx/nginx.conf or custom)
# ==============================================================================

user www-data;
worker_processes auto;  # Use available CPU cores
pid /run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;  # Linux-specific high-performance event model
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression (reduces bandwidth ~70%)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # HTTP/2 Push Server Hint
    http2_max_field_size 16k;
    http2_max_header_size 32k;

    # ===========================================================================
    # Upstream Definition: atomic_mcp_server backend
    # ===========================================================================
    upstream mcp_backend {
        # Single backend on loopback (not exposed to network)
        server 127.0.0.1:5678 max_fails=3 fail_timeout=30s;

        # Keepalive connections (reduce latency)
        keepalive 32;

        # Health check (optional, requires nginx+ or custom check module)
        # health_uri /health;
        # health_interval 5s;
        # health_timeout 2s;
    }

    # ===========================================================================
    # TLS Server Configuration (atomic_mcp_server.conf)
    # ===========================================================================
    server {
        # Listen on 443 (HTTPS) for all interfaces
        listen 443 ssl http2 reuseport;
        listen [::]:443 ssl http2 reuseport;

        # Server name (certificate domain)
        server_name mcp.kindly.ai;

        # =======================
        # TLS/SSL Configuration
        # =======================

        # Certificate and private key (from Let's Encrypt or your CA)
        ssl_certificate /etc/letsencrypt/live/mcp.kindly.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mcp.kindly.ai/privkey.pem;

        # DH parameters (2048-bit, for perfect forward secrecy)
        ssl_dhparam /etc/nginx/dhparam.pem;

        # TLS 1.3 only (no legacy versions)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;

        # TLS 1.3 cipher suites (automatically selected by OpenSSL)
        # TLS 1.3 negotiation is simpler: only AEAD+HKDF pairs
        ssl_ciphers 'TLS13+ECDHE-ECDSA-AES128-GCM-SHA256:TLS13+ECDHE-RSA-AES128-GCM-SHA256';

        # Session cache (improves TLS resumption, reduces handshake latency)
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;
        ssl_session_ticket_key /etc/nginx/ticket.key;

        # Stapling (OCSP validation)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/mcp.kindly.ai/chain.pem;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # =======================
        # Security Headers
        # =======================

        # Strict Transport Security (HSTS)
        # Tells browsers to always use HTTPS for this domain (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy (CSP)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # X-Frame-Options (prevent clickjacking)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # X-Content-Type-Options (prevent MIME sniffing)
        add_header X-Content-Type-Options "nosniff" always;

        # X-XSS-Protection (legacy XSS filter)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # =======================
        # Root location (health check)
        # =======================
        location / {
            root /var/www/html;
            try_files $uri @backend;
        }

        # =======================
        # Backend proxy (@backend)
        # =======================
        location @backend {
            # Proxy to atomic_mcp_server on loopback
            proxy_pass http://mcp_backend;

            # Proxy headers (preserve original client info)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            # Keepalive to backend
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts (adjust based on MCP RPC latency)
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering (disable for streaming responses)
            proxy_buffering off;
            proxy_request_buffering off;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # =======================
        # Health check endpoint
        # =======================
        location /health {
            proxy_pass http://mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # =======================
        # Metrics endpoint (optional)
        # =======================
        location /metrics {
            proxy_pass http://mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Restrict metrics to internal IPs
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # =======================
        # Static files (if any)
        # =======================
        location ~* ^/assets/ {
            root /var/www;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # =======================
        # Deny access to sensitive files
        # =======================
        location ~ /\. {
            deny all;
        }

        location ~ ~$ {
            deny all;
        }

        # =======================
        # Error pages
        # =======================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ===========================================================================
    # HTTP to HTTPS Redirect (http_redirect.conf)
    # ===========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name mcp.kindly.ai;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$server_name$request_uri;

        # Allow Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

}
