[package]
name = "kdb-mcp-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Kindly Software Inc."]
description = "T1 Atomic MCP stdio-to-HTTP bridge for KDB debugger"
license = "Proprietary"
publish = false

[workspace]

[dependencies]
# Minimal dependencies - ureq for HTTP (no async runtime)
ureq = { version = "2.9", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
