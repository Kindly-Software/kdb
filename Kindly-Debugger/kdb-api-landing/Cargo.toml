[package]
name = "kdb-api-landing"
version = "0.1.0"
edition = "2021"
description = "API documentation landing page for api.kindly.software"
license = "Proprietary"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Shared UI components
kindly-ui = { path = "../kindly-ui" }

# Leptos 0.7
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Web APIs
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement"] }

# HTTP client for stats polling
gloo-net = "0.5"
gloo-timers = "0.3"

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints]
workspace = true
