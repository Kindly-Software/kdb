[package]
name = "kindly-services"
version = "1.0.0"
edition = "2021"
description = "Premium landing page for Kindly Debugger - First audit-compliant time-travel debugger"
license = "Proprietary"

[lib]
crate-type = ["cdylib", "rlib"]

# Native server binary for self-hosted deployment
[[bin]]
name = "kindly-services-server"
path = "src/main.rs"

# Production HTTP server using COCA capsule architecture
[[bin]]
name = "http_server"
path = "src/bin/http_server.rs"

# Supply chain verification (native-only, not for WASM)
[[bin]]
name = "supply_chain"
path = "src/bin/supply_chain.rs"
required-features = ["supply-chain"]

[dependencies]
# Better error messages in WASM
console_error_panic_hook = "0.1"
# Leptos 0.7 (CSR mode for pure WASM)
leptos = { version = "0.7", features = ["csr"] }
leptos_meta = "0.7"
leptos_router = "0.7"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Web APIs (WebGL, Canvas, Animation)
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "WebGlContextAttributes",
    "Performance",
    "Navigator",
    "Clipboard",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
    "Location",
    "console",
] }
js-sys = "0.3"

# Utilities
gloo-timers = "0.3"
gloo-events = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

# Protection capsules (native-only, feature-gated)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# atomic_capsule with encryption support (encrypted-state feature enables AES-256-GCM)
atomic_capsule = { path = "../atomic_capsule", default-features = false, features = ["std", "http", "security-adaptive-rate-limiter", "security-constant-time-ops", "encrypted-state"], optional = true }
lazy_static = { version = "1.5", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
security-headers = ["dep:atomic_capsule", "dep:lazy_static"]
http-audit = ["dep:atomic_capsule", "dep:lazy_static"]
rate-limiting = ["dep:atomic_capsule", "dep:lazy_static"]
supply-chain = ["dep:atomic_capsule", "dep:sha2", "dep:hex"]
# Phase 3: Encryption at rest for audit logs (SOX/SOC2/GDPR/HIPAA compliance)
# Uses EncryptedStateCapsule with AES-256-GCM encryption and HKDF-SHA256 key derivation
encryption = ["dep:atomic_capsule", "dep:lazy_static"]
full-protection = ["security-headers", "http-audit", "rate-limiting", "encryption", "supply-chain"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Keep this project out of the parent workspace
[workspace]
