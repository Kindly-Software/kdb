[package]
name = "kdb"
version = "0.1.0"
edition = "2021"
authors = ["Samuel <samuel@primitives.dev>"]
description = "KDB - The Kindly Debugger: T6 Mixed audit-compliant debugger with cryptographic hash-chain integrity (10-30× faster than GDB)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/kdb"
keywords = ["debugger", "audit", "compliance", "capsule", "lockfree"]
categories = ["development-tools::debugging", "development-tools"]

[dependencies]
# Core atomic operations
atomic_capsule = { version = "0.9", path = "../../atomic_capsule", features = ["std", "http", "security-adaptive-rate-limiter", "security-constant-time-ops"] }

# Bitflags for SessionFlags (session tier detection)
bitflags = "2.4"

# Optional: atomic_capsule_derive for automatic verification
atomic_capsule_derive = { version = "0.9", path = "../../atomic_capsule_derive", optional = true }

# BLAKE3 cryptographic hash for tamper-evident audit trails (Q34 compliance)
# - Auto-detects SIMD: AVX-512 > AVX2 > SSE4.1 > NEON > scalar
# - 2-8× faster than SHA-256, cryptographically secure (collision resistant)
blake3 = "1.5"

# CRC32/64 for legacy compatibility (non-cryptographic, use BLAKE3 for audit)
crc = "3.0"

# Ed25519 signature verification for license validation
ed25519-dalek = "2.1"

# SHA-2 family cryptographic hash functions (SHA-256, SHA-512)
sha2 = "0.10"

# Constant-time operations for timing attack protection
subtle = "2.5"

# Random number generation (for license signing feature)
rand = { version = "0.8", optional = true }

# Serialization framework
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding/decoding for certificate signatures
hex = "0.4"

# TOML configuration file parsing
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
libc = "0.2"  # For memory/FD limit tests in production stress
tempfile = "3.10"  # For chaos testing temporary directories
thiserror = "1.0"  # For E2E test harness error types

# Ptrace support (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["ptrace"] }
gimli = "0.31"
object = { version = "0.36", features = ["read"] }
memmap2 = "0.9"
libc = "0.2"
errno = "0.3"

[features]
default = ["std"]

# Standard library support
std = []

# SIMD support (requires nightly Rust)
# - AVX2 on x86_64 (auto-detected at runtime)
# - NEON on aarch64 (auto-detected at runtime)
simd = []

# Automatic verification with #[derive(ComputationalCapsule)]
derive = ["atomic_capsule_derive"]

# Property testing (T28 Q8-Q14 compliance)
property-tests = []

# License signing capability (requires rand crate, admin/testing only)
# SECURITY: Only enable for license generation servers, never in client binaries
license-signing = ["rand"]

# Operator challenge-response authentication (requires rand for secure nonce generation)
# Enable for MCP servers that need to authenticate operators
operator-challenge = ["rand"]

# Test helpers for setting internal state (for integration tests)
test-helpers = []

# CLI binary (interactive debugger command line interface)
cli = ["std"]

# CLI dispatcher tests (requires dispatcher module, currently disabled)
# TODO: Re-enable after PtraceWrapperCapsule imports are fixed
cli-dispatcher = []

# Platform-specific features (automatically enabled per target OS)
# See https://github.com/yourorg/kdb/docs/PLATFORM_SUPPORT.md
linux-ptrace = []      # Linux ptrace debugging (default on Linux)
macos-mach = []        # macOS Mach API debugging (planned, not yet implemented)
windows-debug = []     # Windows Debug API debugging (planned, not yet implemented)

# Chaos testing with real failure injection (requires Linux, CAP_SYS_PTRACE)
# WARNING: These tests modify system resource limits - run in isolated environment
chaos-testing = []

# All features
all = ["std", "simd", "derive", "property-tests"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false  # Keep debug symbols for debugger

[profile.bench]
inherits = "release"

[[example]]
name = "stack_unwinding_demo"
path = "examples/stack_unwinding_demo.rs"
required-features = ["std", "simd"]

[[example]]
name = "register_reader_demo"
path = "examples/register_reader_demo.rs"
required-features = ["std"]

[[example]]
name = "heisenbug"
path = "examples/heisenbug.rs"
required-features = ["std"]

[[example]]
name = "buffer_overflow_target"
path = "examples/buffer_overflow_target.rs"
required-features = ["std"]

[[example]]
name = "use_after_free_target"
path = "examples/use_after_free_target.rs"
required-features = ["std"]

[[example]]
name = "signal_storm"
path = "examples/signal_storm.rs"
required-features = ["std"]

[[example]]
name = "anti_debug_target"
path = "examples/anti_debug_target.rs"
required-features = ["std"]

[[example]]
name = "deadlock_circular"
path = "examples/deadlock_circular.rs"
required-features = ["std"]

[[bin]]
name = "kdb-cli"
path = "src/bin/kdb-cli.rs"
required-features = ["cli"]

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
required-features = ["license-signing"]

[[bench]]
name = "time_travel"
path = "benches/time_travel.rs"
required-features = ["std"]
harness = false

[[bench]]
name = "session_pool_b32_bench"
path = "benches/session_pool_b32_bench.rs"
required-features = ["std"]
harness = false

[[bench]]
name = "memory_replay_b32_bench"
path = "benches/memory_replay_b32_bench.rs"
required-features = ["std"]
harness = false

[[bench]]
name = "full_replay_e2e_bench"
path = "benches/full_replay_e2e_bench.rs"
required-features = ["std"]
harness = false

[[test]]
name = "production_stress"
path = "tests/production_stress.rs"
harness = true

[[test]]
name = "deadlock_detection"
path = "tests/deadlock_detection.rs"
harness = true

[[test]]
name = "memory_corruption_tests"
path = "tests/memory_corruption_tests.rs"
harness = true

[[test]]
name = "chaos_tests"
path = "tests/chaos/mod.rs"
harness = true
required-features = ["chaos-testing"]

[[test]]
name = "license_tests"
path = "tests/license_tests.rs"
harness = true
required-features = ["test-helpers"]

[[test]]
name = "cli_integration"
path = "tests/cli_integration.rs"
harness = true
required-features = ["cli-dispatcher"]

[profile.test]
opt-level = 2  # Optimize tests for realistic performance measurement
