[package]
name = "atomic_latency_ticket"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "ALT-128 Atomic Latency Ticket for single-read path health snapshots"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_latency_ticket"
keywords = ["atomic", "latency", "trading", "telemetry"]
categories = ["concurrency", "finance", "embedded"]
readme = "README.md"

[features]
default = ["require-cas"]
require-cas = ["portable-atomic/require-cas"]
std = []

[dependencies]
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }

[dev-dependencies]
proptest = "1.4"

[package.metadata.docs.rs]
all-features = true
