[package]
name = "train_tinyml"
version = "0.1.0"
edition = "2021"
description = "TinyML tree training pipeline: sklearn IsolationForest JSON to Q8.8 quantized binary format"
authors = ["Kindly Team"]
license = "Proprietary"
rust-version = "1.75"

[dependencies]
# Minimal dependencies - COCA-compliant, no heavy frameworks

[features]
default = []

[[bin]]
name = "train_tinyml"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
