[package]
name = "ccpm-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.5"
colored = "2.1"
reqwest = { version = "0.12", features = ["blocking"] }
tempfile = "3.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ccpm-install"
path = "src/main.rs"

[lints]
workspace = true
