[package]
name = "fix_padding_fields"
version = "0.2.0"
edition = "2021"

[lib]
name = "fix_padding_fields"
path = "src/lib.rs"

[[bin]]
name = "fix_padding_fields"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
regex = "1.10"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prettyplease = "0.2"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "ast_vs_regex"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
