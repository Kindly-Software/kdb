[package]
name = "test_support"
version = "0.1.0"
edition = "2021"
authors = ["Samuel & Claude"]
description = "Shared test utilities and benchmarking support for Primitives"
license = "PROPRIETARY"

[lib]
doctest = false

[dependencies]
# Statistical analysis and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
statrs = "0.17"

# Serialization for test data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random data generation
rand = "0.8"
rand_chacha = "0.3"

# Timing and concurrency
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
ordered-float = "4.2"

# Atomic primitives for circuit breaker integration
atomic_breaker = { path = "../atomic_breaker" }

# Nightly features (conditional)
[features]
default = ["std"]
std = []
nightly = ["portable_simd", "const_fn_floating_point_arithmetic"]
portable_simd = []
const_fn_floating_point_arithmetic = []

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }