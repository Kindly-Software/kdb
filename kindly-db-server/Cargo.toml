[package]
name = "kindly-db-server"
version = "0.1.0"
edition = "2021"
authors = ["Kindly Software <hello@kindly.tools>"]
description = "KindlyDB HTTP REST API server for kdb-signup persistence"
license = "Proprietary"

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Persistence
rocksdb = "0.22"

# Prometheus metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "kindly-db-server"
path = "src/main.rs"
