[package]
name = "atomic_risk_envelope"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "Atomic 128-bit risk envelope handling per-account guardrails"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_risk_envelope"
keywords = ["atomic", "risk", "trading", "envelope"]
categories = ["concurrency", "finance"]
readme = "README.md"

[dependencies]
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
clap = { version = "4.5", features = ["derive"], optional = true }

[features]
default = ["bin"]
serde = ["dep:serde", "dep:serde_json"]
bin = ["dep:clap"]

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
assert_cmd = "2.0"
atomic_risk_ladder_table = { path = "../atomic_risk_ladder_table" }

[[bench]]
name = "multi_account_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
