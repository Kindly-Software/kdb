[package]
name = "git_coordinator_bench"
version = "0.1.0"
edition = "2021"

# Exclude from workspace (standalone benchmark project)
[workspace]

[dependencies]
atomic_capsule = { path = "../atomic_capsule", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "coordinator"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "claude_workflow"
harness = false
