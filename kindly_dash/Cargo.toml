[workspace]
members = [".", "dashboard-ui"]
resolver = "2"

[package]
name = "kindly_dash"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Samuel <samuel@primitives.io>"]
description = "Real-time monitoring dashboard for the Kindly ecosystem"
license = "MIT OR Apache-2.0"
repository = "https://github.com/primitives/kindly_dash"
keywords = ["dashboard", "monitoring", "real-time", "websocket", "metrics"]
categories = ["web-programming", "visualization"]

[dependencies]
# Core atomic capsule infrastructure with comprehensive hash features
# Features breakdown:
# - std: Standard library support (required)
# - derive: #[derive(ComputationalCapsule)] macro (automatic verification)
# - audit-trail: BLAKE3 + xxHash64 for Q34 Auditability (SOX, SOC2, GDPR, HIPAA)
# - const-hashing: Compile-time FNV-1a hash (0ns runtime, 100× speedup)
# - simd-hashing: SIMD multi-field hash (2-8× for 4+ fields, nightly)
# - capsule-serialize: FixedPointSerialize trait (deterministic serialization)
# - histogram: HistogramCapsule (50× vs hdrhistogram, 1024 buckets)
atomic_capsule = { path = "../atomic_capsule", features = [
    "std",
    "derive",
    "audit-trail",
    "const-hashing",
    "capsule-serialize",
    "histogram",
] }
atomic_capsule_derive = { path = "../atomic_capsule_derive" }

# HTTP server & WebSocket
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
tower-http = { version = "0.5", features = ["cors", "compression-br"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
bincode = "1.3"  # Deterministic serialization for HashedCapsule (Q34)

# Standard utilities
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Optional metrics
dashmap = "6.1"  # For concurrent alert subscriptions

# Hash implementations are now in atomic_capsule foundation
# Kept here only for backward compatibility (re-exported from atomic_capsule)
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"], optional = true }
blake3 = { version = "1.5", optional = true }
sha2 = { version = "0.10", optional = true }

[dependencies.clapi_core]
path = "../clapi_core"
optional = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
parking_lot = "0.12"

[features]
default = ["clapi-integration"]
clapi-integration = ["clapi_core"]

# Nightly optimizations (optional, enabled in CI/benchmarks)
nightly-all = [
    "atomic_capsule/const-hashing",
    "atomic_capsule/simd-hashing",
    "atomic_capsule/nightly-all",
]

# Hash features (forward to atomic_capsule)
const-hashing = ["atomic_capsule/const-hashing"]
simd-hashing = ["atomic_capsule/simd-hashing"]

# Hash features (deprecated, kept for backward compatibility)
# All hash functionality now lives in atomic_capsule foundation
fast-hash = []  # No-op, always available via atomic_capsule
audit-trail = []  # No-op, enabled by default in atomic_capsule features
fips-compliant = []  # No-op, use atomic_capsule/fips-compliant directly

# SIMD features (deprecated, use nightly-all instead)
simd = ["nightly-all"]  # Alias for backward compatibility

[lib]
bench = false

[[example]]
name = "clapi_integration"
path = "examples/clapi_integration.rs"

[[example]]
name = "standalone"
path = "examples/standalone.rs"

[[example]]
name = "custom_metrics"
path = "examples/custom_metrics.rs"

[[bench]]
name = "hash_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
