[package]
name = "atomic_pre_execution_capsule"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "PEX-1024 pre-executed playbook capsule for staging four ready-to-fire plays"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_pre_execution_capsule"
keywords = ["atomic", "trading", "capsule", "pre-execution"]
categories = ["concurrency", "finance"]
readme = "README.md"

[features]
default = ["checksum"]
checksum = []
require-cas = ["portable-atomic/require-cas"]
sim = ["serde", "serde_json"]

[dependencies]
atomic_breaker = { path = "../atomic_breaker" }
atomic_risk_ladder_table = { path = "../atomic_risk_ladder_table" }
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "hot_loop"
harness = false
