events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 8080;
        server_name dedup.kindly.software;
        root /usr/share/nginx/html;
        index index.html;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Redirect /latest/ to GitHub Releases
        location /latest/kindly_dedup-linux-x86_64 {
            return 302 https://github.com/kindly-ai/kindly_dedup/releases/download/v2.0.0/kindly_dedup-linux-x86_64;
        }

        location /latest/kindly_dedup-linux-x86_64.asc {
            return 302 https://github.com/kindly-ai/kindly_dedup/releases/download/v2.0.0/kindly_dedup-linux-x86_64.asc;
        }

        # Versioned redirects
        location ~ ^/v([0-9\.]+)/(.*) {
            return 302 https://github.com/kindly-ai/kindly_dedup/releases/download/v$1/$2;
        }

        # Serve landing page for root
        location / {
            try_files $uri $uri/ /index.html;
        }

        # CORS headers for downloads
        location ~* \.(exe|dmg|pkg|deb|rpm|tar\.gz)$ {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
        }
    }
}
