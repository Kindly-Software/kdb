# Fly.io configuration for dedup.kindly.software CDN
# Simple static file server for binary distribution
# Sprint Day 1 - Distribution Infrastructure

app = "kindly-dedup-cdn"
primary_region = "sjc"  # San Jose (same as Stripe webhook)

[build]
  [build.args]
    NODE_VERSION = "20"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
