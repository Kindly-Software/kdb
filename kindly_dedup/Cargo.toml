# [workspace]
# Standalone crate - not part of parent workspace
# DISABLED: Part of parent workspace

# P1 Migration (2025-11-08): rayon v1.10 → atomic_capsule::parallel::ThreadPool
# Impact: -300KB binary size, -15K lines external code, 1.5-2× proven speedup
# Files: batch_lookup.rs + week1_parallel_generation.rs
# Status: ✅ COMPLETE (see DEPENDENCY_REPLACEMENT_REPORT.md § P1)

[package]
name = "kindly_dedup"
version = "2.0.0"  # CliCapsule migration - zero dependencies, 95% clap parity, 40% faster builds
edition = "2021"
rust-version = "1.76.0"
authors = ["Samuel <samuel@kindly.software>"]
description = "LLM training dataset deduplication using computational capsules (T10 Probabilistic)"
license = "Proprietary"
publish = false  # TRADE SECRET - DO NOT PUBLISH

[dependencies]
atomic_capsule = { path = "../atomic_capsule", version = "0.6.0", features = ["std", "native", "derive", "probabilistic", "cpu-capabilities", "capsule-mmap", "capsule-serialize", "encrypted-state", "const-hashing", "crypto-license", "tokenization-batch", "cli", "queue-bounded", "queue-unbounded"] }
atomic_capsule_derive = { path = "../atomic_capsule_derive" }
# P0 Protection Capsules (Phase P0 Integration)
# NOTE (2025-11-10): Cannot remove ed25519-dalek, rsa - transitive deps not directly importable
ed25519-dalek = { version = "2.1", optional = true }
rsa = { version = "0.9", optional = true }
hkdf = "0.12"  # Required for trial_state encryption (Docker trials)
# TEMPORARY (2025-11-17): Re-add rayon for legacy code compatibility
# TODO: Complete P1 migration to atomic_capsule::parallel in all files
rayon = { version = "1.10", optional = true }
# REMOVED (2025-11-10): parking_lot → Only used in comments, not in production code
# parking_lot = "0.12"  # TEMPORARY: Phase 1 cache (to be replaced with ConcurrentMapCapsule in Phase 2)
# REMOVED: num_cpus = "1.16"  # Replaced with std::thread::available_parallelism()
# REMOVED (2025-11-08): sysinfo = "0.30" → std::thread::available_parallelism() + /proc/meminfo (Linux)
reqwest = { version = "0.12", features = ["stream", "gzip"], optional = true }
# Tokio removed - using std::thread + lockfree queue (SyncFlushTask)
hyper = { version = "1.0", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", optional = true }
rustls = { version = "0.23", optional = true }
bytes = { version = "1.0", optional = true }
flate2 = { version = "1.0", optional = true }

# Format Architecture Dependencies (Week 1: Core + JSONL/JSON/CSV)
# T5 Streaming + T2 SIMD format readers for COCA compliance
simd-json = { version = "0.13", optional = true }  # T2 SIMD: 2.31× JSON speedup
csv = { version = "1.3", optional = true }  # T5 Streaming CSV reader

# Production API Server (Minimal External Deps)
config = { version = "0.14", optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

# KindlyDB + kindly_dash Integration (Our Own Primitives)
kindly-db = { path = "../kindly-db", optional = true, features = ["std"] }
kindly_dash = { path = "../kindly_dash", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# NOTE (2025-11-08): indicatif kept for async download_corpus binary only (requires tokio async runtime)
# Main library and non-async tools replaced with atomic_capsule::parallel::BatchProgressRenderer
# Future: Migrate download_corpus to std::thread + atomic_capsule (remove tokio dependency)
indicatif = { version = "0.17", optional = true }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"  # For config directory (Layer 2 flag files)

# Q34 Audit trail dependencies (Phase 1)
# NOTE (2025-11-10): sha2, hmac, blake3 are required - atomic_capsule doesn't re-export these
# hex dependency REMOVED (2025-11-10): Using atomic_capsule::auditable::hex (<10ns encode/decode)
sha2 = "0.10"
hmac = "0.12"  # For meta-capsule protection
blake3 = "1.8.2"  # Required for Q34 audit trail (Layer 4)
bincode = "1.3"  # For meta-capsule serialization
chrono = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }

# Docker fingerprinting dependencies (Phase 7.1 - Trial Docker)
uuid = { version = "1.6", features = ["v4"] }  # Runtime UUID generation for volume ID
hostname = "0.4"  # Fallback container ID detection

# Layer 2: AES-256-GCM encryption (algorithm parameter protection)
# NOTE (2025-11-10): Cannot remove aes-gcm - transitive deps not directly importable
aes-gcm = "0.10"

# NUMA allocation support
libc = "0.2"

# CPU detection (used for thread pool sizing)
num_cpus = "1.16"

# Crossbeam utilities (for atomic operations in streaming pipeline)
crossbeam-utils = "0.8"

# Crossbeam channels (for streaming pipeline coordination)
crossbeam-channel = "0.5"

# Hex encoding/decoding (for audit trail hex serialization)
hex = "0.4"

# Interactive TUI Stack (v0.2.0)
# NOTE: clap is now provided by atomic_capsule::cli feature
inquire = { version = "0.9", default-features = false, features = ["crossterm"], optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.28", optional = true }
# REMOVED (2025-11-10): colored, atty → Replaced with std::io::IsTerminal + ANSI escape codes
# colored = { version = "2.1", optional = true }
# atty = { version = "0.2", optional = true }
glob = { version = "0.3", optional = true }
fs_extra = { version = "1.3", optional = true }
directories = { version = "5.0", optional = true }

# GUI Stack (egui - v1.14.0)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"], optional = true }

# GUI Stack (iced - v0.10.0, Mac-level UX)
iced = { version = "0.10", features = ["tokio", "canvas", "debug"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
rfd = { version = "0.15", optional = true }  # Native file dialogs (cross-platform)

[build-dependencies]
# Layer 1: Build-time binary protection
# Note: sha2 needed for build.rs (build-dependencies don't inherit from main dependencies)
sha2 = "0.10"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
proptest = "1.4"
# [REMOVED P1] rayon → atomic_capsule::parallel (100% lockfree, 1.5-2× faster)
# rayon = "1.10"  # For test parallel execution

[features]
default = ["std"]
std = ["atomic_capsule/std"]

# Format Architecture Features (Week 1: Core + JSONL/JSON/CSV)
# T5 Streaming + T2 SIMD format readers for COCA compliance
format-json = ["simd-json"]    # JSONL + JSON readers (simd-json, 2.31× speedup)
format-csv = ["csv"]            # CSV reader (csv crate)
format-all = ["format-json", "format-csv"]  # All formats

# Nightly Rust features (required for SIMD, obfuscation, etc.)
nightly = ["atomic_capsule/nightly"]

# SIMD-accelerated MinHash (T2 SIMD tier, nightly required)
simd-minhash = ["nightly", "atomic_capsule/portable_simd"]

# Week 1: SIMD LSH band hashing (T2 SIMD tier, 4× speedup target, nightly required)
# Expected: 1.37× total throughput (35.7% coverage × 4× = 1.37×)
# B32: Fair baseline (scalar band hashing), 1000+ iterations, 95% CI
simd-lsh = ["nightly", "atomic_capsule/portable_simd"]

# Week 2: SIMD text hashing (2-8× token hashing speedup, requires simd-minhash)
simd-text-hashing = ["simd-minhash", "atomic_capsule/portable_simd", "atomic_capsule/simd-hashing"]

# Cache-optimized MinHash (1.2-1.3× speedup, loop transpose + prefetching)
cache-optimized-minhash = ["simd-minhash", "nightly"]

# Phase 1: AVX-512 runtime dispatch (16-lane SIMD, 2× AVX2 speedup, nightly required)
avx512-minhash = ["simd-minhash", "nightly", "atomic_capsule/cpu-capabilities"]

# Parallel deduplication (atomic_capsule::parallel + rayon temporarily)
# Parallel deduplication using atomic_capsule::parallel (100% lockfree, zero rayon)
# Migration complete: 2025-11-08 - All rayon usage replaced with atomic_capsule primitives
parallel-dedup = ["std", "dep:rayon"]

# Persistent deduplication (T9+T10: mmap-backed streaming, 93% memory reduction)
# v1.3: Migrated from mmap-persistence to capsule-mmap for zero-copy atomic storage
# Note: Phase 4.4 integration - persistent mode uses parallel pipeline internally
persistent-dedup = ["atomic_capsule/capsule-mmap", "atomic_capsule/nightly-atomic", "std", "parallel-dedup"]

# HTTP server (pure atomic_capsule HTTP - legacy basic server)
http-server = []

# Production API Server (atomic_capsule runtime + HTTP + KindlyDB + Protection)
# Uses ExecutorCapsule + ReactorCapsule + AsyncTcpListener + HttpServer primitives
# Zero Tokio, Zero Axum, 100% atomic_capsule (2-50× faster)
production-api = [
    "std",
    # atomic_capsule runtime primitives (95% Tokio replacement)
    "atomic_capsule/runtime-executor",      # ExecutorCapsule (task spawning)
    "atomic_capsule/runtime-reactor",        # ReactorCapsule (epoll/kqueue event loop)
    "atomic_capsule/queue-unbounded",        # Timer wheel dependency
    "atomic_capsule/async-channels",         # MPSC/oneshot/broadcast/watch
    "atomic_capsule/kind-tcp",               # AsyncTcpListener/Stream
    "atomic_capsule/runtime-net",            # AsyncUdpCapsule
    "atomic_capsule/runtime-signal",         # AsyncSignalCapsule
    "atomic_capsule/runtime-process",        # AsyncProcess
    "atomic_capsule/streaming-async",        # AsyncFileCapsule
    # atomic_capsule HTTP primitives (7× faster than httparse)
    "atomic_capsule/http-simd",              # HTTP/1.1 SIMD parser (T2 SIMD)
    # Note: http-server feature does not exist in atomic_capsule, HTTP server is in-tree
    # Dedup + storage
    "persistent-dedup",                      # T9+T10 persistent MinHash/LSH
    "parallel-dedup",                        # Parallel deduplication
    "dep:kindly-db",                         # KindlyDB for persistent storage
    "dep:kindly_dash",                       # kindly_dash for monitoring
    # Protection layers
    "meta-capsule-full",                     # All 11 protection layers
    # Logging + config
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:config",
    "dep:toml",
    # Q34 audit trail
    "audit-trail",
]

# Download tools (existing binaries)
# Note: Tokio required for async download_corpus (async HTTP streaming)
# Note: indicatif kept for download_corpus only (async context), atomic_capsule used elsewhere
download-tools = ["reqwest", "flate2", "dep:indicatif", "chrono", "futures-util"]

# HuggingFace dataset downloader (T8 Network + T5 Streaming + T1 Atomic)
hf-datasets = ["download-tools", "dep:tokio"]

# Benchmarking infrastructure (Phase 1-5: includes export methods)
benchmarking = ["std", "chrono", "atomic_capsule/queue-bounded"]

# Q34 Audit trail (hash-chained tamper-evident logging)
audit-trail = ["std"]

# SIMD-accelerated Jaccard computation (T2 SIMD tier)
simd-jaccard = ["atomic_capsule/portable_simd", "simd-minhash"]

# Parallel ground truth generation (T4 Batch tier)
parallel-ground-truth = ["std"]

# Compound ground truth (T2+T4: SIMD + Parallel)
compound-ground-truth = ["simd-jaccard", "parallel-ground-truth"]

# Batch LSH lookup (Week 2 P1 optimization: 1.3-2× dedup speedup, T4 Batch tier)
# Note: atomic_capsule::parallel is available with "std" feature
batch-lsh = ["std"]

# Bounded DocumentId pattern (Type-safe bounded document IDs)
bounded-docid = []

# Binary protection (Layer 2: Weaponized Circuit Breaker)
# Feature-gated for testing flexibility (disabled by default)
# NOTE: Production builds SHOULD enable this feature
binary-protection = ["std", "atomic_capsule/nightly", "atomic_capsule/portable_simd"]

# Client demo with optional META_CAPSULE protection
client-demo = ["benchmarking", "compound-ground-truth"]

# META_CAPSULE protection (4-layer hardware-bound IP protection)
meta-capsule = ["binary-protection"]

# P0 Protection Capsules (Phase P0 Integration - 3 capsules)
# Note: Wrappers call atomic_capsule primitives, so enable corresponding atomic_capsule features
protection-crypto-license = ["dep:ed25519-dalek", "dep:rsa", "atomic_capsule/crypto-license"]
protection-encrypted-state = ["atomic_capsule/encrypted-state"]  # hkdf is now always available (Docker trials)
protection-build-hardening = []  # Build-time only, no atomic_capsule feature
meta-capsule-p0 = ["protection-crypto-license", "protection-encrypted-state", "protection-build-hardening", "meta-capsule"]

# P1 Protection Capsules (Phase P1 Integration - 5 capsules from atomic_capsule)
protection-tpm-binding = ["atomic_capsule/tpm-binding"]
protection-fuzzy-extractor = ["atomic_capsule/fuzzy-extractor"]
protection-obfuscation = ["nightly", "atomic_capsule/nightly"]  # ObfuscationCapsule requires nightly
protection-remote-attestation = ["atomic_capsule/remote-attestation", "dep:hyper-rustls", "dep:rustls", "dep:bytes"]
remote-attestation = ["protection-remote-attestation"]  # Alias for convenience
meta-capsule-p1 = ["meta-capsule-p0", "protection-tpm-binding", "protection-fuzzy-extractor", "protection-obfuscation", "protection-remote-attestation"]

# P2 Protection System (Phase P2 Integration - 11-layer orchestrated protection)
# ProtectionOrchestratorCapsule from atomic_capsule + 3 wrapper capsules
# NOTE: Three features below are stubs until atomic_capsule implements them
# TODO Phase P3: orchestrator - ProtectionOrchestratorCapsule coordination (11-layer stack)
orchestrator = []  # Stub wrapper (no atomic_capsule feature yet)
# NOTE: Wrapper feature is anomaly-detector, atomic_capsule feature is anomaly-detection
anomaly-detector = ["atomic_capsule/anomaly-detection"]  # Wrapper for atomic_capsule anomaly-detection feature
# TODO Phase P3: memory-encryption - MemoryEncryptionWrapper (AES-256-GCM protected memory regions)
memory-encryption = []  # Stub wrapper (no atomic_capsule feature yet)
# TODO Phase P3: kernel-protection - KernelProtectionWrapper (syscall filtering + capabilities)
kernel-protection = []  # Stub wrapper (no atomic_capsule feature yet)
meta-capsule-full = ["meta-capsule-p1", "orchestrator", "anomaly-detector", "memory-encryption", "kernel-protection"]

# Interactive TUI (v0.2.0: 6 commands, E2E workflows, META_CAPSULE protected)
# Note: indicatif removed (2025-11-08) - using atomic_capsule::parallel::BatchProgressRenderer
# UPDATED (2025-11-17): Migrated to atomic_capsule::cli::CliCapsule (zero direct dependencies)
interactive = [
    "dep:inquire",
    "dep:ratatui",
    "dep:crossterm",
    "dep:glob",
    "dep:fs_extra",
    "dep:directories",
    "dep:indicatif",
    "meta-capsule",
    "benchmarking",
    "compound-ground-truth",
]

# GUI (egui - drag & drop, progress bars, cross-platform)
# Simple, clean UX for non-technical users (10-15× better conversion vs CLI)
# Note: Uses sequential pipeline (parallel-dedup has compilation issues to fix)
gui = [
    "dep:eframe",
    "dep:rfd",
    "std",
    "benchmarking",
]

# GUI (iced - Mac-level UX, Byzantine purple + gold branding)
# Premium GUI with smooth animations, custom widgets, professional polish
gui-iced = [
    "dep:iced",
    "dep:tokio",
    "dep:rfd",
    "std",
    "benchmarking",
]

# Full features (all capabilities)
full = ["parallel-dedup", "http-server", "download-tools", "simd-minhash", "benchmarking", "binary-protection", "interactive", "gui", "audit-trail"]

