# Layer 1: Build-time binary protection configuration
# - Customer-specific builds with unique CUSTOMER_ID
# - Binary signing with SHA-256 signature
# - Aggressive optimization for maximum obfuscation
# - Symbol stripping for IP protection
[profile.release]
opt-level = 3           # Maximum optimization (code complexity, size reduction)
lto = "fat"            # Full link-time optimization (cross-crate inlining)
codegen-units = 1      # Single codegen unit (maximum optimization, slower build)
strip = "symbols"      # Strip debug symbols (reduces binary size, prevents inspection)
# panic = "abort" commented out - crypto deps (ed25519-dalek) require "unwind"

[profile.dev]
# Use Rust default (panic = "unwind")

[profile.test]
# Use Rust default (panic = "unwind")

# Post-build steps (shell commands):
# 1. Strip all symbols (additional to Cargo strip):
#    $ strip --strip-all target/release/kindly_dedup
#
# 2. Sign binary (GPG signing for authenticity):
#    $ gpg --detach-sign --armor target/release/kindly_dedup
#    $ gpg --verify target/release/kindly_dedup.asc target/release/kindly_dedup
#
# 3. Verify embedded constants (runtime verification):
#    $ target/release/kindly_dedup --version
#    Customer ID: [embedded UUID]
#    Build Signature: [embedded SHA-256]
#
# 4. Package for distribution:
#    $ tar czf kindly_dedup-${CUSTOMER_ID}.tar.gz \
#        target/release/kindly_dedup \
#        target/release/kindly_dedup.asc \
#        LICENSE README.md

[profile.bench]
inherits = "release"
panic = "unwind"
