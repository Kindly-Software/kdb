name: Test Suite

on:
  push:
    branches: [main, phase2.4.1-derive-macro-migration, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  # ==============================================================================
  # Fast Suite: Smoke + Functional Tests (runs on every push)
  # ==============================================================================
  fast-suite:
    name: Fast Suite (P0 Critical Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../atomic_capsule

      - name: Verify atomic_capsule path
        run: ls -la ../atomic_capsule/Cargo.toml

      - name: Build library
        run: cargo build --lib --release

      - name: Build binary
        run: cargo build --bin kindly_dedup --release

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint check
        run: cargo clippy --lib --release -- -D warnings

      - name: Run P0 unit tests
        run: cargo test --lib p0_unit --release

      - name: Run P0 integration tests
        run: cargo test --test p0_integration --release

      - name: Test binary help
        run: ./target/release/kindly_dedup --help

      - name: Test binary version
        run: ./target/release/kindly_dedup --version

  # ==============================================================================
  # Full Suite: Comprehensive Tests (runs on main branch and PRs)
  # ==============================================================================
  full-suite:
    name: Full Suite (P0-P2 Comprehensive)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../atomic_capsule

      - name: Build library
        run: cargo build --lib --release

      - name: Build binary
        run: cargo build --bin kindly_dedup --release

      - name: Run library tests (all)
        run: cargo test --lib --release

      - name: Run integration tests
        run: cargo test --test '*' --release || true

      - name: Test with SIMD features
        run: cargo test --features simd-minhash --release simd_integration

      - name: Verify test results
        run: |
          TEST_RESULT=$(cargo test --lib --release 2>&1 | grep "test result")
          echo "$TEST_RESULT"
          if echo "$TEST_RESULT" | grep -q "ok"; then
            echo "All tests passed"
            exit 0
          else
            echo "Some tests failed or no tests found"
            exit 1
          fi

  # ==============================================================================
  # Feature Matrix: Test different feature combinations
  # ==============================================================================
  feature-matrix:
    name: Features - ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        features:
          - "default"
          - "simd-minhash"
          - "persistent-dedup"
          - "audit-trail"
          - "protection-encrypted-state"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../atomic_capsule

      - name: Build with features
        run: cargo build --release --features "${{ matrix.features }}"

      - name: Test with features
        run: cargo test --release --features "${{ matrix.features }}"

  # ==============================================================================
  # CPU Feature Matrix: Scalar, SSE4.2, AVX2
  # ==============================================================================
  cpu-features:
    name: CPU Features - ${{ matrix.cpu-tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        cpu-tier:
          - name: "Scalar (no SIMD)"
            rustflags: "-C target-feature=-avx2,-sse4.2"
          - name: "SSE4.2 (no AVX2)"
            rustflags: "-C target-feature=-sse2,+sse4.2,-avx2"
          - name: "AVX2 (full)"
            rustflags: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../atomic_capsule

      - name: Build for ${{ matrix.cpu-tier.name }}
        run: cargo build --release --features default
        env:
          RUSTFLAGS: ${{ matrix.cpu-tier.rustflags }}

      - name: Test for ${{ matrix.cpu-tier.name }}
        run: cargo test --lib --release
        env:
          RUSTFLAGS: ${{ matrix.cpu-tier.rustflags }}

  # ==============================================================================
  # Cross-Platform: macOS compatibility check
  # ==============================================================================
  macos-check:
    name: macOS Compatibility
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../atomic_capsule

      - name: Build library
        run: cargo build --lib --release

      - name: Run unit tests
        run: cargo test --lib p0_unit --release

      - name: Run integration tests
        run: cargo test --test p0_integration --release

  # ==============================================================================
  # Summary: Report test results
  # ==============================================================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [fast-suite, full-suite]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.fast-suite.result }}" != "success" ] || [ "${{ needs.full-suite.result }}" != "success" ]; then
            echo "❌ Test suite failed"
            echo "Fast Suite: ${{ needs.fast-suite.result }}"
            echo "Full Suite: ${{ needs.full-suite.result }}"
            exit 1
          else
            echo "✅ All test suites passed"
            exit 0
          fi
