[package]
name = "atomic_breaker"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "Universal atomic, bit-packed circuit breaker primitive"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_breaker"
keywords = ["atomic", "circuit", "breaker", "lock-free"]
categories = ["concurrency", "data-structures", "embedded"]
readme = "README.md"

[features]
default = ["standard64"]
# Mutually exclusive layout modes - only one can be active
standard64 = []
compact48 = []
mpmc = []
std = []
serde = ["dep:serde"]
pmu = ["std", "dep:perfcnt"]
diagnostics = []
auto_tune = ["std"]

[dependencies]
atomic_risk_ladder_table = { path = "../atomic_risk_ladder_table" }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
perfcnt = { version = "0.8", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
once_cell = "1.19"
rand = "0.9"
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "microbench"
harness = false
