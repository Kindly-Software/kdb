# Fly.io Configuration for Kindly-Verified Web
# Deployment: kindly-verified-web
# Region: San Jose (sjc) for US West proximity

app = "kindly-verified-web"
primary_region = "sjc"

[build]
builder = "paketobuildpacks/builder:base"
buildpacks = [
  { image = "heroku/buildpacks:20" }
]

[env]
# Production environment
ENVIRONMENT = "production"

[http_service]
# Internal port matches Docker EXPOSE
internal_port = 8080
protocol = "http"
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["web"]

# HTTP port mapping
[[services]]
internal_port = 8080
protocol = "http"
processes = ["web"]

[services.ports]
port = 80
handlers = ["http"]

[services.ports]
port = 443
handlers = ["tls", "http"]

# Health check
[services.http_checks]
enabled = true
grace_period = "10s"
interval = "10s"
method = "GET"
path = "/health"
protocol = "http"
timeout = "5s"
tls_skip_verify = false

# Machine settings
[vm]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024

# Persistent storage (optional)
[mounts]
# For storing uploaded images temporarily
source = "kindly_verified_data"
destination = "/data"

# Auto scaling (optional)
[auto_scaling]
enabled = false  # Set to true for production traffic
min_machines = 1
max_machines = 3
policies = [
  { type = "cpu_percentage", threshold = 70 }
]

# Metrics and monitoring
[metrics]
port = 9090
