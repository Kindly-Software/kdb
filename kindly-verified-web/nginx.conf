# Nginx configuration for Kindly-Verified WASM static hosting
# Optimized for WASM delivery with compression and proper MIME types

server {
    listen 8080 http2;
    listen [::]:8080 http2;
    server_name _;

    # Root directory for static files
    root /usr/share/nginx/html;

    # Client body size
    client_max_body_size 100M;

    # =============================================================================
    # COMPRESSION SETTINGS
    # =============================================================================

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-opentype
        application/x-font-truetype
        application/x-font-ttf
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/eot
        font/opentype
        font/otf
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml
        text/x-component
        text/x-cross-domain-policy
        application/wasm;  # CRITICAL: Include WASM
    gzip_comp_level 6;

    # Enable brotli compression (if available)
    # brotli on;
    # brotli_types application/wasm application/javascript text/css;

    # =============================================================================
    # MIME TYPES (CRITICAL FOR WASM)
    # =============================================================================

    types {
        application/wasm                              wasm;
        application/javascript                        js mjs;
        text/css                                       css;
        text/html                                      html;
        image/svg+xml                                  svg;
        font/woff2                                     woff2;
        application/font-woff                          woff;
    }
    default_type application/octet-stream;

    # =============================================================================
    # CACHE HEADERS
    # =============================================================================

    # Immutable assets (versioned by hash in filename)
    location ~* ^/dist/.*\.[a-f0-9]{8,}\. {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # WASM files (cache aggressively, they're versioned)
    location ~* \.wasm$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # Allow CORS for WASM (if needed for cross-origin access)
        # add_header Access-Control-Allow-Origin "*";
    }

    # JavaScript and CSS (cache for 1 week)
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
    }

    # Images and fonts (cache for 30 days)
    location ~* \.(jpg|jpeg|png|gif|ico|woff|woff2|ttf|eot|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # HTML files (don't cache, always check for updates)
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # =============================================================================
    # SECURITY HEADERS
    # =============================================================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # =============================================================================
    # ROUTING
    # =============================================================================

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }

    # Metrics endpoint (if enabled)
    location /metrics {
        deny all;
    }

    # API proxy (if needed for backend)
    # location /api/ {
    #     proxy_pass http://backend:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # =============================================================================
    # ERROR PAGES
    # =============================================================================

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    # =============================================================================
    # LOGGING
    # =============================================================================

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}

