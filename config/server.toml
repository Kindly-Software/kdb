# connection_timeout = 10

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================
[performance]
# Memory optimization
enable_memory_pooling = true
memory_pool_size = 1000
enable_string_interning = false  # Only for <100 unique strings

# CPU optimization
enable_cpu_affinity = true
cpu_cores_reserved = 1  # Reserve 1 core for OS
cpu_profiling = false  # Enable only for debugging

# Cache optimization
enable_l1_cache = true
enable_l2_cache = true
l1_cache_size = 32768  # 32KB
l2_cache_size = 262144  # 256KB

# SIMD optimization
enable_simd = true
simd_batch_size = 256
detect_cpu_features = true
