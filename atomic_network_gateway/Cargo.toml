[package]
name = "atomic_network_gateway"
version = "0.1.0"
edition = "2021"
authors = ["Samuel <samuel@example.com>"]
description = "Lockfree network gateway primitive for high-frequency trading"
license = "MIT"

[dependencies]
# Minimal dependencies following IMPL-2 constraints
tokio = { version = "1.0", features = ["net", "io-util", "time"], optional = true }
thiserror = "1.0"

[features]
default = []
async = ["tokio"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "network_throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"