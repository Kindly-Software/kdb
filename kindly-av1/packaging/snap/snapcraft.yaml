name: kindly-av1
version: '1.0.0'
summary: World's fastest GPU-accelerated AV1 encoder
description: |
  kindly-av1 delivers breakthrough encoding performance through 100% lockfree
  COCA (Computational Capsule) architecture and GPU acceleration (ROCm/Vulkan).

  ## Features

  - **GPU-Accelerated Motion Estimation**: 10-100× faster than CPU-only encoders
  - **Checkpoint/Resume**: Crash recovery with automatic state persistence
  - **Real-Time Dashboard**: Live progress monitoring with OBS Studio integration
  - **License-Based Activation**: Secure Ed25519 cryptographic license validation
  - **100% Lockfree Architecture**: Zero mutex/RwLock overhead (<10ns coordination)
  - **Multi-Backend Support**: Vulkan (primary), ROCm, CUDA fallback

  ## GPU Requirements

  - **Recommended**: AMD RX 6000/7000 series or NVIDIA RTX 3000/4000 series
  - **Minimum**: Any Vulkan 1.2+ compatible GPU
  - **Memory**: 4GB+ VRAM for 1080p, 8GB+ for 4K

  ## Quick Start

  ```bash
  # Encode video with GPU acceleration
  kindly-av1 input.mp4 output.ivf --crf 23 --gpu

  # Two-pass VBR encoding for target bitrate
  kindly-av1 input.mp4 output.ivf --bitrate 5M --two-pass

  # Show real-time dashboard
  kindly-av1 input.mp4 output.ivf --dashboard

  # Resume interrupted encode from checkpoint
  kindly-av1 --resume checkpoint.kav1
  ```

  ## License

  kindly-av1 is FREE for personal/educational use. Commercial licenses available
  at https://kindly.dev/pricing (pay-what-you-want, starting $0/month).

  GPU acceleration requires a license key (free tier: 720p@30fps).
  Get your license at https://kindly.dev/activate

  ## Documentation

  - Homepage: https://kindly.dev
  - GitHub: https://github.com/kindly-ai/kindly-av1
  - Support: support@kindly.dev

grade: stable
confinement: strict

base: core22
architectures:
  - build-on: amd64
    build-for: amd64

# Snap apps (binary exposure)
apps:
  kindly-av1:
    command: bin/kindly-av1
    plugs:
      - home                    # Access user files
      - removable-media         # Access external drives
      - network                 # License validation, OBS WebSocket
      - network-bind            # HTTP server for OBS overlay
      - opengl                  # Vulkan/GPU access
      - hardware-observe        # GPU device detection
    environment:
      # Vulkan ICD loader paths (Snap confinement workaround)
      VK_ICD_FILENAMES: /var/lib/snapd/lib/vulkan/icd.d/radeon_icd.x86_64.json:/var/lib/snapd/lib/vulkan/icd.d/nvidia_icd.json
      VK_LAYER_PATH: /var/lib/snapd/lib/vulkan/explicit_layer.d
      # ROCm paths (if available on host)
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu

# Build parts
parts:
  kindly-av1:
    plugin: dump
    source: ../../target/x86_64-unknown-linux-gnu/release/
    source-type: local
    organize:
      kindly-av1: bin/kindly-av1

    # Runtime dependencies (Vulkan, Mesa, OpenGL)
    stage-packages:
      # Vulkan runtime
      - libvulkan1
      - mesa-vulkan-drivers

      # Mesa OpenGL/EGL (GPU compute fallback)
      - libgl1-mesa-dri
      - libglx-mesa0
      - libegl1-mesa

      # Core graphics libraries
      - libx11-6
      - libxcb1
      - libxau6
      - libxdmcp6

      # ROCm runtime (optional, if available on host)
      # Note: ROCm is typically installed on host, not bundled in snap

    # Strip debug symbols to reduce snap size
    stage:
      - bin/kindly-av1
      - usr/lib/*/libvulkan*
      - usr/lib/*/dri/*
      - usr/lib/*/libGL*
      - usr/lib/*/libEGL*
      - usr/share/vulkan/icd.d/*
      - usr/share/glvnd/egl_vendor.d/*

# Plugs for GPU access (auto-connect where possible)
plugs:
  opengl:
    interface: opengl
  hardware-observe:
    interface: hardware-observe

# Layout for Vulkan ICD discovery
layout:
  /usr/share/vulkan:
    bind: $SNAP/usr/share/vulkan
  /usr/lib/x86_64-linux-gnu/dri:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/dri
