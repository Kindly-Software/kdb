[package]
name = "kindly-av1-keygen"
version = "1.0.0"
edition = "2021"
authors = ["Kindly <support@kindly.dev>"]
description = "Ed25519 keypair generator for kindly-av1 license signing"
license = "Proprietary"
publish = false

# [TRADE SECRET] - This tool generates private signing keys
# NEVER commit private keys to version control

[dependencies]
# Ed25519 signing (SOTA implementation per ed25519-dalek docs)
# https://docs.rs/ed25519-dalek
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
rand = "0.8"
base64 = "0.22"

[[bin]]
name = "keygen"
path = "src/main.rs"
