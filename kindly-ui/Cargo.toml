[package]
name = "kindly-ui"
version = "0.1.0"
edition = "2021"
description = "Shared Leptos UI components - Byzantine Royal Purple + Gold design system"
license = "Proprietary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos 0.7 (CSR mode for WASM)
leptos = { version = "0.7", features = ["csr"] }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Web APIs (WebGL for mesh gradient)
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "Performance",
    "Navigator",
    "Clipboard",
] }
js-sys = "0.3"

# Utilities
gloo-timers = "0.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints]
workspace = true
