[workspace]
members = [
    "kindly_core",
    "kindly_consensus",
    "kindly_ubi",
    "kindly_network",
    "kindly_governance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kindly Coin Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kindly/kindly-coin"
homepage = "https://kindly.software/coin"
keywords = ["cryptocurrency", "blockchain", "atomic-capsule", "ubi", "lockfree"]
categories = ["cryptography", "network-programming", "concurrency"]

[workspace.dependencies]
# Atomic capsule foundation
atomic_capsule = { path = "../atomic_capsule", version = "0.1" }
atomic_capsule_map = { path = "../atomic_capsule_map", version = "0.1" }

# Internal dependencies
kindly_core = { path = "kindly_core", version = "0.1.0" }
kindly_consensus = { path = "kindly_consensus", version = "0.1.0" }
kindly_ubi = { path = "kindly_ubi", version = "0.1.0" }
kindly_network = { path = "kindly_network", version = "0.1.0" }
kindly_governance = { path = "kindly_governance", version = "0.1.0" }

# Cryptography
ed25519-dalek = "2.1"
sha3 = "0.10"
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
libp2p = "0.53"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Testing
proptest = "1.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true  # Q32: Strip symbols for smaller binaries

[profile.release.package."*"]
opt-level = 3  # Q32: Optimize all dependencies

[profile.bench]
inherits = "release"
debug = true
