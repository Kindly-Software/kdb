[workspace]
# Standalone workspace (excluded from parent Primitives workspace)

[package]
name = "clapi_wasm"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "=0.6.15", features = ["csr"] }
leptos_meta = { version = "=0.6.15" }
leptos_router = { version = "=0.6.15" }
ewebsock = "0.5"
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = { version = "0.3" }
gloo-utils = { version = "0.2" }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
plotters-canvas = { version = "0.3" }
atomic_capsule = { path = "../../../atomic_capsule", features = ["derive"] }
atomic_capsule_derive = { path = "../../../atomic_capsule_derive" }
dashmap = "6.1"
futures = "0.3"
tracing = "0.1"
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lib]
crate-type = ["cdylib", "rlib"]
