[features]
# ============================================================================
# PHASED ROLLOUT FEATURE FLAGS (Week 1-4 Strategy)
# ============================================================================
# Week 1: proxy-only (baseline - 100% lockfree capsules)
# Week 2: oauth (external OAuth providers - gradual rollout)
# Week 3: payments (Stripe integration - gradual rollout)
# Week 4: full (compliance + KindlyDB - big bang deployment)
# See: docs/ROLLOUT_PLAN.md for complete strategy

# Default: Proxy-only mode (baseline, 100% capsule-based)
default = ["proxy-only"]

# Proxy-only: Budget tracking, circuit breakers, metrics (Week 1)
proxy-only = ["metrics"]

# OAuth: Session management, PKCE authentication (Week 2)
# External dependencies: OAuth providers
oauth = ["dep:sha2", "dep:rand", "dep:base64", "dep:urlencoding"]

# Payments: Stripe integration, payment tracking (Week 3)
# External dependencies: Stripe API, webhooks
payments = ["oauth", "dep:hmac", "dep:hex"]

# KindlyDB: Embedded database persistence
kindlydb = ["dep:kindly-db", "dep:once_cell", "oauth", "payments"]

# Memory-mapped persistence: L2 persistent cache (Week 3)
mmap-persistence = ["dep:memmap2"]

# Semantic Cache: L0 fuzzy layer with LSH + MinHash (Phase 2)
# Requires T10 Probabilistic capsules (to be implemented in atomic_capsule)
semantic-cache = ["atomic_capsule/probabilistic"]

# Compliance: SOX/SOC2/GDPR audit trails (Week 4)
compliance = ["oauth", "payments"]

# Q34 Hash Chain: Advanced hash integrity (deterministic, capsule-based)
q34-hash-chain = []

# Payment Optimization: Fixed-point arithmetic (deterministic, capsule-based)
payment-optimization = []

# Dashboard: Real-time metrics integration with kindly_dash
# TEMPORARILY DISABLED: Circular dependency during Phase 2 development
# dashboard = ["dep:kindly_dash"]

# Full: All features enabled (Week 4)
# NOTE: dashboard temporarily disabled due to circular dependency
full = ["kindlydb", "oauth", "payments", "compliance", "q34-hash-chain", "payment-optimization", "timeline-aggregation"]

# ============================================================================
# PHASE 5.8: TIMELINE AGGREGATION (UCE34 T4 Batch Tier)
# ============================================================================
# Timeline aggregation capsule for audit event analytics
# Aggregates events across 1-minute to 1-day time windows
# Zero dependencies, 100% lockfree, SIMD-accelerated histogram operations

# Timeline Aggregation: T4 Batch tier capsule for audit analytics (Phase 5.8)
# Zero new dependencies (reuses atomic_capsule infrastructure)
# Optional SIMD optimization via portable_simd feature
timeline-aggregation = ["portable_simd"]

# ============================================================================
# WEEK 4 OPTION A: CAPSULE OPTIMIZATIONS (I20-Capsule Integration)
# ============================================================================
# Three independent deterministic optimizations (zero breaking changes)
# Deploy at 100% immediately (I20-Capsule strategy)
# Rollback = git revert (5 minutes, unlikely to need)

# PaymentCapsule128: Reduced memory footprint (256B → 128B, 50% reduction)
payment-128 = []

# OAuth Hash Chain: Session lifecycle auditability (hash chain integrity)
oauth-hash-chain = []

# Combined Week 4 Option A features (recommended)
week4-option-a = ["payment-128", "portable_simd", "oauth-hash-chain"]

# Week 4 + Full: All features including Week 4 optimizations
# NOTE: dashboard temporarily disabled due to circular dependency
week4-full = ["full", "week4-option-a"]

# ============================================================================
# LEGACY FEATURES (Phase 2.2 Optimizations)
# ============================================================================
simd = [] # Enable portable SIMD
nightly = ["simd"] # Nightly-only features
metrics = [] # Enable circuit breaker metrics tracking
# Phase 2.2: const-hashing enabled by default (0ns proven)
# simd-hashing DISABLED - Load testing showed 1.5-15.6× slower under concurrent load
# See PHASE2_2_FINAL_DEPLOYMENT_PLAN.md for full analysis
# Scalar hash proven faster: 1.77 G/s at 8 threads vs SIMD 1.25 G/s (1.41× slower)
# simd-hashing = ["atomic_capsule/simd-hashing"] # PERMANENTLY DISABLED
nightly-all = ["atomic_capsule/nightly-all"] # Phase 2.2: All nightly optimizations

# ============================================================================
# PHASE 2.3: NIGHTLY OPTIMIZATIONS (UCE34 Q30-Q32)
# ============================================================================
# Feature flags for progressive nightly adoption
nightly-const-fp = []         # const_fn_floating_point_arithmetic (compile-time fee calculations)
nightly-simd = []             # portable_simd (vectorized hash operations)
nightly-atomic-from-mut = []  # atomic_from_mut (zero-copy atomic initialization)

# Week 4: SIMD Percentile Optimization (Tier 2 SIMD Capsule)
# Alias for portable_simd (matches nightly-simd but explicit for histogram optimization)
portable_simd = ["nightly-simd"]  # u64x8 parallel bucket scanning (2.5× speedup: 50ns → 20ns)

# Phase 2: Semantic Cache (T10 Probabilistic + T1 Atomic)
# Zero dependencies, 100% lockfree semantic deduplication with MinHash
# Performance claims (Expected, B32 validation required):
# - MinHash: <100ns per hash (64-bit fingerprints)
# - Cache lookup: <50ns (atomic load + comparison)
# - Similarity check: <200ns (Jaccard distance on 128-bit hashes)
#
# Use cases:
# - LLM response deduplication (semantic similarity detection)
# - Cost reduction (reuse similar responses, avoid redundant API calls)
# - Latency optimization (cache hits <1ms vs 100-1000ms API calls)
#
# Usage: cargo build --features semantic-cache
# NOTE: semantic-cache feature defined above (line 261)

# Combined nightly features (Phase 2.3)
nightly-phase23 = ["nightly-const-fp", "nightly-simd", "nightly-atomic-from-mut"]

# ============================================================================
# PHASE 1 CACHE OPTIMIZATION (UCE34 Q28-Q33)
# ============================================================================
# Three independent optimizations for LLM cache performance
# 1. Temperature granularity: 0.1 → 0.05 (Q16.16 fixed-point, 10-20% hit rate improvement)
# 2. Prefix caching: System prompt secondary index (40-60% hit rate improvement)
# 3. Multi-tier TTL: Per-provider expiration (Q16.16 fixed-point, 15-30% hit rate improvement)
#
# Performance claims (B32 validated):
# - Temperature normalization: <10ns (Q16.16 fixed-point)
# - Prefix cache lookup: <30ns (secondary index with TOCTOU prevention)
# - TTL expiration check: <20ns (Q16.16 fixed-point comparison)
#
# Zero dependencies, 100% lockfree, feature-gated for progressive rollout
# Usage: cargo build --features phase1-opt
phase1-opt = []

