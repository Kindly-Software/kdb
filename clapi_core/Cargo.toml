# ============================================================================
# NIGHTLY OPTIMIZATION (Phase 2.3) - UCE34 Q30-Q32
# ============================================================================
# Low-risk optimizations: LLD linker, Fat LTO, codegen-units=1
# Expected: 30% faster builds, 10-20% smaller binary, negligible runtime improvement

[profile.release]
opt-level = 3              # Maximum optimization
lto = "fat"                # Link-time optimization (better inlining)
codegen-units = 1          # Single codegen unit (longer compile, better optimization)
strip = true               # Strip symbols (smaller binary)
panic = "abort"            # No unwinding (faster, smaller)

[profile.bench]
inherits = "release"       # Benchmarks use same optimization as release

# Use LLD linker for 30% faster builds (nightly only)
# Enabled via: cargo +nightly build --release
# Note: rustflags should be set in .cargo/config.toml, not here
# See .cargo/config.toml for LLD linker configuration



