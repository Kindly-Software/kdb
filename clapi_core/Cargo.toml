[package]
name = "clapi_core"
version = "0.4.8"
edition = "2021"
rust-version = "1.83"
authors = ["Samuel <samuel@primitives.io>"]
description = "AI call protection proxy with computational capsule architecture"
license = "MIT OR Apache-2.0"
repository = "https://github.com/primitives/clapi_core"
keywords = ["ai", "proxy", "budget", "audit", "capsule"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# Core atomic capsule infrastructure
atomic_capsule = { path = "../atomic_capsule", features = ["const-hashing", "async-log", "histogram"] }
atomic_capsule_derive = { path = "../atomic_capsule_derive" }

# KindlyDB - Embedded database with computational capsules (optional for rollout)
kindly-db = { path = "../kindly-db", optional = true }

# Dashboard integration (optional)
# TEMPORARILY DISABLED: Circular dependency with kindly_dash during Phase 2 Semantic Cache development
# kindly_dash = { path = "../kindly_dash", optional = true }

# Lazy static initialization (for ComplianceWriter singleton)
once_cell = { version = "1.20", optional = true }

# Standard dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true } # For audit log hash chains and OAuth2 PKCE
portable-atomic = "1.10" # For AtomicU128 support
dashmap = "6.1" # For lockfree concurrent maps (rate_limiter_jitter, ws_pool - entry/iter support needed)
siphasher = "1.0" # SipHash-2-4 for LLM cache key derivation (collision-resistant)

# OAuth2 dependencies (optional for Week 2 rollout)
rand = { version = "0.8", optional = true } # CSPRNG for PKCE state generation
base64 = { version = "0.22", optional = true } # Base64URL encoding for PKCE
urlencoding = { version = "2.1", optional = true } # URL parameter encoding

# HTTP server
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
toml = "0.8"

# WebSocket binary serialization (Phase 3)
bincode = "1.3"

# CLI Framework (Kindly UX)
clap = { version = "4.5", features = ["derive", "cargo", "color", "suggestions"] }
dialoguer = { version = "0.11", features = ["completion", "fuzzy-select"] }
indicatif = { version = "0.17", features = ["rayon"] }
colored = "2.1" # DEPRECATED: Legacy ANSI-16 support (fallback only)
owo-colors = "4.1" # RGB color support with terminal detection (Byzantine Purple + Gold)
tabled = "0.15"
crossterm = "0.27"
ratatui = "0.28" # TUI framework with Byzantine Purple theme
uuid = { version = "1.11", features = ["v4"] } # For mock provider IDs
sys-info = "0.9" # System resource checks (disk, memory)
nix = { version = "0.29", features = ["signal", "process"] } # Process management (SIGTERM, SIGKILL)
dirs = "5.0" # Cross-platform config directory detection
ctrlc = "3.4" # Double Ctrl+C handler for graceful wizard exit

# Payment processing (Stripe) (optional for Week 3 rollout)
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }

# Compression (Week 3: Feature 2)
zstd = "0.13" # High-performance zstd compression (Tier 5 Streaming)

# Deployment automation (P0 Enhancement 10)
chrono = "0.4" # Timestamp formatting for deployment backups

# Memory-mapped persistence (L2 cache)
memmap2 = { version = "0.9", optional = true } # Memory-mapped file I/O for L2 persistent cache

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
parking_lot = "0.12"
crossbeam = "0.8"
rust_decimal = "1.36"
rand = "0.8"
rand_distr = "0.4"  # For timeline fixture normal distribution
tokio-test = "0.4"
tempfile = "3.14"
futures = "0.3"
regex = "1.10"  # For P3-E1 distributed tracing tests

