[workspace]
members = [
    "kindly_bench",
    "kindly_bench_macros",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Samuel"]
license = "PROPRIETARY"
rust-version = "1.82"

[workspace.dependencies]
# Procedural macro dependencies
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = false
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
