[package]
name = "atomic_ledger_entry"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "ALE-128 Atomic Ledger Entry for tamper-evident trading audit logs"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_ledger_entry"
keywords = ["atomic", "ledger", "audit", "trading"]
categories = ["concurrency", "finance"]
readme = "README.md"

[features]
default = ["require-cas", "stream"]
require-cas = ["portable-atomic/require-cas"]
std = []
stream = ["std", "crossbeam-queue"]
cli = ["std", "clap"]

[dependencies]
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }
blake3 = { version = "1.5", default-features = false }
crossbeam-queue = { version = "0.3", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
rand = { version = "0.9", features = ["std"] }
criterion = "0.5"

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "alechk"
path = "src/bin/alechk.rs"
required-features = ["cli"]
