[package]
name = "atomic_event_lockout_map"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "ECO-1024 event lockout map for atomic trading session gating"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_event_lockout_map"
keywords = ["atomic", "trading", "event", "lockout"]
categories = ["concurrency", "finance"]
readme = "README.md"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
bitflags = "2.4"

[dev-dependencies]
proptest = "1.4"
once_cell = "1.19"
rand = "0.9"

[package.metadata.docs.rs]
all-features = true
