[package]
name = "fixed_point_tier3"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"  # Stable Rust (const_fn features benefit from nightly)
authors = ["Samuel <samuel@kindly.dev>"]
description = "Tier 3: Fixed-Point Capsules - Deterministic precision primitives with 2-10× speedup + zero FP drift"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kindly-ai/fixed_point_tier3"
keywords = ["fixed-point", "capsule", "deterministic", "financial", "tier3"]
categories = ["concurrency", "data-structures", "embedded", "no-std"]
readme = "README.md"

# UCE33 Q10: Tier 3 (Fixed-Point Capsules) - Deterministic precision
# - Proven speedups: 2-10× vs floating-point (P&L 83.4ns vs ~200ns)
# - Zero floating-point drift (Q8.8, Q16.16, Q32.32 formats)
# - Deterministic rounding for regulatory compliance
# - Cache-aligned atomic fixed-point operations

[features]
default = ["std"]

# Core features (orthogonal, no hidden dependencies)
std = []  # Enable standard library support

# Fixed-point precision levels
q8_8 = []    # Q8.8 format (0.004 basis point precision, 8-bit integer, 8-bit fraction)
q16_16 = []  # Q16.16 format (0.000015 precision, 16-bit integer, 16-bit fraction)
q32_32 = []  # Q32.32 format (10^-10 precision, 32-bit integer, 32-bit fraction)
all_formats = ["q8_8", "q16_16", "q32_32"]  # Enable all fixed-point formats

# Nightly features (optional, compile-time computation)
nightly = ["const_fn"]  # Enable nightly Rust features
const_fn = []  # Compile-time fixed-point conversion (const_fn_floating_point_arithmetic)

# Testing features
test_utils = []  # Enable testing utilities (not for production)

[dependencies]
# ZERO external dependencies - only atomic_capsule foundation
atomic_capsule = { path = "../atomic_capsule", version = "0.4.0" }

# No external dependencies - all fixed-point arithmetic is built-in

[dev-dependencies]
# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"  # Property-based testing for fixed-point invariants
trybuild = "1.0"  # Compile-fail tests for overflow detection

[lib]
name = "fixed_point_tier3"
path = "src/lib.rs"

# Benchmarks (criterion-based) - TODO: Add benchmark files
# [[bench]]
# name = "fixed_point_operations"
# harness = false

# B32 Benchmarking Framework compliance
# - Baseline: Same hardware/compiler, f64 floating-point implementation
# - Statistical rigor: 95% CI, 1000+ iterations
# - Fair comparison: Optimized floating-point baseline (FMA enabled)
# - Reality check: 2-10× typical for Tier 3, validated
# - Determinism: Zero drift validated across 1M+ operations

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Nightly feature requirements
# - const_fn_floating_point_arithmetic: Nightly-only (compile-time conversion)
#   - Enable: rustup default nightly && cargo build --features const_fn
#   - Fallback: Runtime conversion on stable Rust (no performance impact)

# Platform support matrix
# - All platforms: Fixed-point is pure integer arithmetic (universally portable)
# - x86_64: Optimal (64-bit integer ops)
# - aarch64: Optimal (64-bit integer ops)
# - riscv64: Optimal (64-bit integer ops)
# - 32-bit platforms: Use Q16.16 for optimal performance

# Precision formats
# - Q8.8:   Range ±127.99609375, Precision 0.00390625 (1/256)
# - Q16.16: Range ±32767.999985, Precision 0.000015259 (1/65536)
# - Q32.32: Range ±2^31, Precision 2.3283064365e-10 (1/2^32)

# Use case recommendations
# - Q8.8:   Sub-dollar financial calculations, percentage tracking
# - Q16.16: Most financial applications, regulatory compliance
# - Q32.32: High-precision scientific computing, GPS coordinates

# Rustc version requirements
# - Stable Rust 1.76+: All features except const_fn
# - Nightly Rust 2024-01-01+: const_fn for compile-time conversion

# Build performance
# - Clean build: ~5s (zero external deps, pure integer ops)
# - Incremental: <1s
# - LLD linker: 30% faster with nightly (optional)

# CI/CD requirements
# - Test on both stable and nightly
# - Validate determinism (bit-exact results across platforms)
# - Property testing (no overflow, rounding correctness)
# - Benchmark vs floating-point (f32, f64)
# - Feature flag matrix testing (all precision formats)

# Standalone crate (not part of workspace)
[workspace]
