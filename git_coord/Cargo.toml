[package]
name = "git_coord"
version = "0.1.0"
edition = "2021"
authors = ["Samuel <samuel@kindly.ai>"]
description = "Lockfree git coordination with T1 Atomic capsules and comprehensive T28 testing"

[lib]
name = "git_coord"
path = "src/lib.rs"

[dependencies]
# Zero external dependencies for core (100% lockfree capsules)
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
blake3 = "1.5"  # For audit hash chains (fastest cryptographic hash)

[dev-dependencies]
proptest = "1.4"  # Property-based testing (T28 Q8-Q14)
criterion = "0.5"  # B32 benchmarking
tempfile = "3.8"  # For integration tests with real git repos

[features]
default = ["serde", "bincode"]
serde = ["dep:serde"]
bincode = ["dep:bincode"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
