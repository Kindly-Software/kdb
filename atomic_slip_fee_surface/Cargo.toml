[package]
name = "atomic_slip_fee_surface"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Samuel <maintainer@example.com>"]
description = "ASF-256 Atomic Slip/Fee Surface packed into two 128-bit words"
license = "Apache-2.0 OR MIT"
repository = "https://example.com/atomic_slip_fee_surface"
keywords = ["atomic", "trading", "slippage", "fees"]
categories = ["concurrency", "finance", "embedded"]
readme = "README.md"

[features]
default = ["require-cas"]
require-cas = ["portable-atomic/require-cas"]
std = []

[dependencies]
portable-atomic = { version = "1.6", default-features = false, features = ["fallback"] }

[dev-dependencies]
proptest = "1.4"

[package.metadata.docs.rs]
all-features = true
