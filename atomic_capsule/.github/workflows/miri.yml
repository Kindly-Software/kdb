name: Miri Undefined Behavior Detection

on:
  push:
    branches: [main, master, analysis/**]
  pull_request:
    branches: [main, master]
  schedule:
    # Run nightly at 2am UTC
    - cron: '0 2 * * *'

env:
  RUST_BACKTRACE: 1
  MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check

jobs:
  miri:
    name: Miri UB Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup Miri
        run: cargo miri setup

      - name: Run Miri tests (lib)
        run: cargo miri test --lib
        continue-on-error: false

      - name: Run Miri tests (integration)
        run: cargo miri test --tests
        continue-on-error: false

      - name: Run Miri with portable_simd feature
        run: cargo miri test --lib --features portable_simd
        continue-on-error: true  # SIMD may not be fully supported yet

  miri-strict:
    name: Miri Strict Mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup Miri
        run: cargo miri setup

      - name: Run Miri with strict checks
        run: |
          MIRIFLAGS="-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-track-raw-pointers" \
          cargo miri test --lib
        continue-on-error: false

  miri-summary:
    name: Miri Summary
    runs-on: ubuntu-latest
    needs: [miri, miri-strict]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Miri UB Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Miri Tests**: ${{ needs.miri.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Miri Strict**: ${{ needs.miri-strict.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.miri.result }}" = "success" ] && [ "${{ needs.miri-strict.result }}" = "success" ]; then
            echo "✅ **All Miri checks passed** - No undefined behavior detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Miri detected issues** - Review test output for undefined behavior" >> $GITHUB_STEP_SUMMARY
          fi
