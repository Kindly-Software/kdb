name: Continuous Fuzzing

on:
  pull_request:
    paths:
      - 'src/http/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz Testing HTTP Module
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        fuzz-target:
          - fuzz_http_request_parser
          - fuzz_http_router
          - fuzz_chunked_encoding
          - fuzz_http_headers
          - fuzz_http_compression

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: |
          cargo install cargo-fuzz --locked

      - name: Run fuzzer for ${{ matrix.fuzz-target }}
        working-directory: ./fuzz
        run: |
          # Run fuzzer with time limit (300 seconds = 5 minutes)
          timeout 300 cargo +nightly fuzz run ${{ matrix.fuzz-target }} \
            -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048 || true
        continue-on-error: true

      - name: Check for crashes
        run: |
          CRASHES=$(find fuzz/artifacts/${{ matrix.fuzz-target }} -type f -name "crash-*" 2>/dev/null | wc -l)
          echo "Found ${CRASHES} crashes in ${{ matrix.fuzz-target }}"

          if [ "${CRASHES}" -gt 0 ]; then
            echo "::warning::Fuzzer found ${CRASHES} crashes in ${{ matrix.fuzz-target }}"
            find fuzz/artifacts/${{ matrix.fuzz-target }} -type f -name "crash-*" -exec echo "  - {}" \;
          fi

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.fuzz-target }}
          path: fuzz/artifacts/${{ matrix.fuzz-target }}/
          retention-days: 30

  summary:
    name: Fuzzing Summary
    runs-on: ubuntu-latest
    needs: fuzz
    if: always()

    steps:
      - name: Check fuzzing status
        run: |
          echo "## Fuzzing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All HTTP module fuzz targets completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fuzz Targets Tested" >> $GITHUB_STEP_SUMMARY
          echo "- fuzz_http_request_parser" >> $GITHUB_STEP_SUMMARY
          echo "- fuzz_http_router" >> $GITHUB_STEP_SUMMARY
          echo "- fuzz_chunked_encoding" >> $GITHUB_STEP_SUMMARY
          echo "- fuzz_http_headers" >> $GITHUB_STEP_SUMMARY
          echo "- fuzz_http_compression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time per target:** 5 minutes (total 25 minutes)" >> $GITHUB_STEP_SUMMARY
          echo "**Input size limit:** 64KB (65536 bytes)" >> $GITHUB_STEP_SUMMARY
          echo "**Memory limit:** 2GB RSS" >> $GITHUB_STEP_SUMMARY
