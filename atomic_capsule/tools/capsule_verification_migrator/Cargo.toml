[package]
name = "capsule_verification_migrator"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "printing", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.4"
colored = "2.0"
regex = "1.10"

[[bin]]
name = "migrate"
path = "src/main.rs"

[workspace]
# Empty workspace to exclude from parent workspace
