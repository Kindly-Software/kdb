# TIER 15: Internal Features (do not use directly)
auto_tune = []  # Internal feature: Enable auto-tuning infrastructure
parking_lot = ["dep:parking_lot"]

# TIER 16: Training Data Migration (combined feature for all 4 capsules)
training-data = ["fixed-point-quantizer", "streaming-strategy-labeler", "persistence-binary-io"]  # All training data capsules

[dependencies]
# ZERO dependencies for core functionality (no_std compatible)
atomic_capsule_derive = { path = "../atomic_capsule_derive", optional = true }

# Tier 0 Auditable - Optional cryptographic dependencies
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"], optional = true }
blake3 = { version = "1.8", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
sha3 = { version = "0.10", default-features = false, optional = true }  # SHA3-256 for AuditCompressionCapsule
sha1 = { version = "0.10", default-features = false, optional = true }  # SHA-1 for WebSocket Sec-WebSocket-Accept (RFC 6455)
hmac = { version = "0.12", default-features = false, optional = true }
rustls-pemfile = { version = "2.0", optional = true }  # PEM certificate/key parsing for TLS
webpki-roots = { version = "0.26", optional = true }  # Mozilla CA root certificates for TLS
highway = { version = "1.2", optional = true }
ed25519-dalek = { version = "2.1", optional = true }  # Ed25519 signatures for CryptoLicenseCapsule

# Cache Module - SipHash + optional HMAC/AES-GCM
siphasher = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }

# T2 SIMD Crypto - NIST-approved cryptographic libraries
# NOTE: These are used for simd-crypto feature only, not for cache module
pbkdf2 = { version = "0.12", default-features = false, features = ["simple"], optional = true }

# Encrypted State - HKDF key derivation
hkdf = { version = "0.12", optional = true }

# Fuzzy Extractor - Reed-Solomon error correction for PUF stability
libc = { version = "0.2", optional = true }
reed-solomon-erasure = { version = "6.0", optional = true }

# Tier 5 Streaming - Async log
tokio = { version = "1.0", features = ["rt", "fs", "io-util", "time", "net", "macros"], optional = true }
once_cell = { version = "1.19", optional = true }  # For logging module global state

# T8 Network - RPC serialization
bincode = { version = "1.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.21", optional = true }  # Base64 encoding for WebSocket Sec-WebSocket-Accept
reqwest = { version = "0.12", features = ["json", "http2"], optional = true }
futures = { version = "0.3", optional = true }

# T8 Remote Attestation - TLS 1.3 + HTTP/2
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
hyper = { version = "1.0", optional = true, features = ["client", "http2"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http2", "ring", "native-tokio"] }
hyper-util = { version = "0.1", optional = true, features = ["client", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1.0", optional = true }

# Distributed Cache - P1 dependencies
zstd = { version = "0.13", optional = true }
hdrhistogram = { version = "7.5", optional = true }

# Serialization
crc32fast = { version = "1.5.0", optional = true }
crc = { version = "3.2", optional = true }

# Tier 9 Persistent - Memory-mapped files
memmap2 = { version = "0.9", optional = true }
bytemuck = { version = "1.14", optional = true, features = ["derive"] }

# T4 Batch Crypto - Ed25519 and ECDSA signature verification
# Ed25519: Native batch verification via Shamir's trick (8× speedup)
# ECDSA (secp256k1): Parallel verification via rayon (8-16× speedup)
k256 = { version = "0.13", optional = true, features = ["ecdsa"] }

# Phase 9: Nightly Adaptive - Topology detection
num_cpus = { version = "1.16", optional = true }

# Phase 2: Inference Primitives - Batch parallelism
rayon = { version = "1.8", optional = true }

# Phase 3: Compression Primitives - LZ4 decompression
lz4_flex = { version = "0.11", optional = true }
thiserror = { version = "2.0", optional = true }

# Phase 4.2: Split-Step Fourier Method
rustfft = { version = "6.2", optional = true }

# T4: Text Processing - Thread-local tokenization buffers (13× speedup)
thread_local = { version = "1.1", optional = true }
hashbrown = { version = "0.14", optional = true }

# Supply Chain Verifier - Typosquatting detection (Levenshtein distance)
strsim = { version = "0.11", optional = true }  # String similarity for typosquatting detection (<1ms @ 1000 packages)

# CLI Binary Dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }

# TUI Dependencies
ratatui = { version = "0.29", optional = true }
glob = { version = "0.3", optional = true }
terminal_size = { version = "0.3", optional = true }  # TerminalCapabilityCapsule size detection

# Circuit Breaker - Optional dependencies
perfcnt = { version = "0.8", optional = true }

# Monitoring Dashboard - Timestamp formatting
chrono = { version = "0.4", optional = true }

# WASM target - wasm-bindgen for std support
wasm-bindgen = { version = "0.2", optional = true }
parking_lot = { version = "0.12", optional = true }

# T7: GPU Acceleration - CUDA backend (Phase 5)
cudarc = { version = "0.10", optional = true, features = ["driver"] }  # CUDA Rust bindings (NVIDIA GPU)

# TPM 2.0 Hardware Binding - Platform-specific
# Platform-specific dependencies
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tss-esapi = { version = "7.5", optional = true, default-features = false }  # TPM 2.0 bindings (TCG Software Stack)

[target.'cfg(target_os = "macos")'.dependencies]
