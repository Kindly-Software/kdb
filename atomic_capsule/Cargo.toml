[package]
name = "atomic_capsule"
version = "0.8.0"  # Complete serialization stack with 35 capsules
edition = "2021"
resolver = "2"  # CRITICAL: Prevents feature unification across targets
rust-version = "1.76"  # Stable unless nightly feature enabled
authors = ["Samuel <samuel@kindly.dev>"]
description = "Foundation primitives for atomic capsule architecture: alignment tiers, retry policies, architecture detection, hash modules, parallel computing, and deterministic serialization"
license = "MIT OR Apache-2.0"
repository = "https://example.com/atomic_capsule"
keywords = ["atomic", "capsule", "alignment", "lock-free", "foundation"]
categories = ["concurrency", "data-structures", "embedded", "no-std"]
readme = "README.md"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(feature, values("diagnostics", "rayon", "DISABLED_PENDING_TRAIT_UPDATE"))'] }

[lints.clippy]
missing_capsule_verification = "deny"  # Fail compilation if capsule lacks verification (Phase 4.0: Automatic verification enforcement)

[workspace]
# Independent workspace - excluded from parent workspace (/home/samuel/Primitives/Cargo.toml)

# ============================================================================
# TIER 0: PLATFORM TARGETS (resolver = "2" required)
# ============================================================================
# Breaking Change (v0.3.4 → v0.4.0):
# - default = [] instead of ["std", "memmap2"]
# - Users must explicitly choose platform preset or enable std
# - See MIGRATION.md for upgrade guide
#
# Platform Targets:
# 1. wasm32-unknown-unknown: WebAssembly (no_std or std via wasm-bindgen)
# 2. native: x86_64/aarch64 Linux/macOS/Windows (std + tokio + memmap2 + rayon)
# 3. embedded: ARM Cortex-M (no_std, alloc optional)
# 4. capsule-os: Future custom OS target (std equivalent)
#
# Feature Strategy:
# - Additive features only (no negative features)
# - Platform features are mutually exclusive (enforced by docs)
# - Tier features are composable (T1+T2+T3 OK)
# - Presets simplify common configurations
#
# Dependency Strategy:
# - All dependencies optional except derive macro
# - Feature gates prevent tokio/memmap2 leaking to wasm
# - resolver = "2" prevents feature unification
#
# ============================================================================

[features]
# TIER 1: Core (BREAKING CHANGE: default = [] instead of ["std", "memmap2"])
default = []  # ⚠️ BREAKING: Users must choose platform or enable std
alloc = []  # Heap allocation (Vec, Box, Arc) without full std
std = ["alloc"]  # Standard library support

# TIER 2: Platform Selection (choose ONE)
# #ASSUME_PLATFORM_EXCLUSIVE: Only one platform feature enabled per build
# #VERIFY_PLATFORM: Documentation warns against mixing platform features
wasm = ["std", "dep:wasm-bindgen"]  # WebAssembly target (wasm32-unknown-unknown)
native = ["std", "dep:memmap2"]  # x86_64/aarch64 Linux/macOS/Windows (tokio now optional)
tokio-compat = ["dep:tokio"]  # Enable only if tokio integration needed (async-log, etc.)
embedded = []  # ARM Cortex-M (no_std, optional alloc)
capsule-os = ["std"]  # Future: Capsule OS native syscalls

# TIER 3: Computational Tiers (composable across platforms)
# #ASSUME_TIER_COMPOSABLE: Multiple tier features can be enabled simultaneously
# #VERIFY_TIER: Each tier has clear dependencies (T2 requires nightly, etc.)

# T0: Auditable Foundation
const-hashing = []  # Compile-time FNV-1a hash (0ns runtime, 100× vs dynamic)
simd-hashing = ["nightly", "portable_simd"]  # SIMD field hashing (2-8× for 4+ fields)
nightly-atomic = ["nightly"]  # AtomicFromMut (zero-copy atomic views, requires #76314)
capsule-serialize = ["std", "dep:crc32fast", "dep:crc"]  # FixedPointSerialize trait (audit trails)
cbor = ["std"]  # T1 Atomic CBOR writer/reader (RFC 8949, <20ns per value, 8KB buffer)
audit-q34 = ["std", "dep:sha2", "dep:serde_json", "dep:hex"]  # Q34 compliance audit trail (SOX/SOC2/GDPR/HIPAA)
fuzzy-extractor = ["std", "dep:reed-solomon-erasure", "dep:sha2", "fixed-point"]  # T10+T3: Reed-Solomon error correction for PUF (96% → 99.9% stability)

# T1: Atomic Coordination (<100ns operations)
atomic-core = []  # Base T1 primitives (DualAtomicU64, generation counters)
cpu-capabilities = ["std"]  # Runtime CPU detection (AVX-512/AVX2/SSE4.2/NEON)
circuit-breaker-standard64 = ["std"]  # Full 64-bit circuit breaker layout
circuit-breaker-compact48 = []  # 48-bit layout for embedded
circuit-breaker-mpmc = ["circuit-breaker-standard64"]  # Multi-writer variant
circuit-breaker-pmu = ["circuit-breaker-standard64", "std", "dep:perfcnt"]  # Linux perf-event
circuit-breaker-auto-tune = ["circuit-breaker-standard64", "std"]  # Adaptive calibration
circuit-breaker-adaptive = ["circuit-breaker-standard64", "fixed-point"]  # T1+T3: 50% FP reduction
circuit-breaker-serde = ["circuit-breaker-standard64", "dep:serde"]  # Serialization
time-travel = ["std"]  # T0+T1: Bidirectional time-travel replay with hash-chain integrity (Q34)
quota-tracker = ["std"]  # T1: Per-user monthly quota tracking (64 KB capsule, <70ns operations)

# T2: SIMD Vectorization (2-19× speedup)
# #ASSUME_SIMD_NIGHTLY: All SIMD features require nightly Rust
simd-stable-wasm = ["wasm"]  # Stable SIMD for WASM (future: wasm-simd128)
simd-nightly-wasm = ["wasm", "nightly", "portable_simd"]  # Nightly SIMD for WASM
simd-native = ["native", "nightly", "portable_simd"]  # Nightly SIMD for native
simd-all = ["simd-stable-wasm", "simd-nightly-wasm", "simd-native"]  # All SIMD variants
http-simd = ["nightly", "portable_simd"]  # T2 SIMD HTTP parsing (7× speedup)
simd-hex = ["nightly", "portable_simd"]  # T2 SIMD hex string encoding (4× speedup, HexEncoderCapsule)

# T3: Fixed-Point Determinism (2-10× speedup)
fixed-point = []  # Q8.8, Q16.16, Q32.32, Q48.16
fixed-point-quantizer = ["fixed-point"]  # T3 Q8.8 quantization (moved from kindly_hft)
fixed-simd = ["fixed-point", "portable_simd"]  # SIMD-accelerated fixed-point
financial-calcs = ["fixed-point"]  # Convenience preset for financial systems
complex-fixed = ["fixed-point"]  # Complex fixed-point arithmetic
const-serialize = ["capsule-serialize", "nightly"]  # Const trait (0ns runtime)
const-float = ["const-serialize"]  # Const fn floating-point
avro = ["std"]  # T1 Atomic Avro binary serialization (<30ns per value, Apache Avro 1.11 compatible)
msgpack = ["std"]  # T1 Atomic MessagePack binary serialization (<20ns per value, MessagePack spec compatible)
toml = ["std"]  # T5 Streaming TOML writer + T1 Atomic TOML parser (<100ns per field, TOML 1.0 spec)

# T4: Batch Processing (10-100× speedup)
batch-native = ["native", "dep:rayon"]  # Rayon-based parallel batching
batch-wasm = ["wasm"]  # WASM-compatible batching (no rayon)
queue-bounded = ["std"]  # Bounded SPSC/MPMC queues (Phase 1) - requires std for tests
queue-unbounded = ["std", "queue-bounded"]  # Unbounded SPSC/MPMC queues (Phase 2) - requires bounded queues as segments
queue-batch = ["std", "queue-unbounded"]  # Batch push/pop operations (Phase 3) - 2× speedup for bulk operations
queue-all = ["queue-bounded", "queue-unbounded", "queue-batch"]  # All queue features
cache = ["std", "dep:siphasher", "dep:rand", "derive"]  # Lockfree cache with TTL (requires derive for verification)
cache-hmac = ["cache", "dep:hmac", "dep:sha2"]  # HMAC-SHA256 integrity
cache-multi-tenant = ["cache"]  # Multi-tenant isolation
cache-encryption = ["cache", "dep:aes-gcm"]  # AES-256-GCM encryption
cache-security-full = ["cache-hmac", "cache-multi-tenant", "cache-encryption"]  # All security features
histogram = ["std", "dep:chrono"]  # Logarithmic buckets, <10ns record
histogram-simd = ["histogram", "portable_simd"]  # 8-way SIMD percentiles
concurrent-map-v3 = ["std"]  # T1 Atomic inline-storage hash map (2-8× vs DashMap, 4× vs v2)

# T4: Text Processing (batch tokenization, 13× speedup vs allocator-locked)
tokenization-batch = ["std", "dep:thread_local", "dep:hashbrown"]  # Thread-local tokenization buffers
tokenization-batch-simd = ["tokenization-batch", "portable_simd"]  # SIMD-accelerated tokenization (3× additional)
multi-process = ["std"]  # T4 Batch: Generic multi-process coordinator (lockfree work-stealing, 16× speedup)

# Lockfree B-tree Features (Phase 11: Ordered Data Structures)
# Usage examples:
#   Basic B-tree: --features lockfree-btree
#   CoW only: --features btree-cow (requires derive)
#   SIMD only: --features btree-simd (requires nightly)
#   Full hybrid: --features btree-cow-simd (requires nightly + derive)
lockfree-btree = ["std"]  # T1 Atomic lockfree B-tree (Phase 11.0, foundation primitive)
btree-cow-simd = ["portable_simd", "btree-cow", "btree-simd", "btree-batch", "derive"]  # T6 Mixed: Hybrid CoW-SIMD B-tree (composite tier)
btree-cow = ["lockfree-btree", "derive"]  # T1 Copy-on-Write foundation (atomic coordination, requires derive for verification)
btree-simd = ["lockfree-btree", "portable_simd"]  # T2 SIMD acceleration for node operations
btree-batch = ["lockfree-btree"]  # T4 Batch processing for bulk operations

ultra-low-latency = []  # HFT mode: Busy-wait for <2µs P99.9
rt-priority = ["ultra-low-latency"]  # Real-time priority + CPU pinning
adaptive-parallel = ["dep:num_cpus"]  # Adaptive queue sizing + NUMA-aware
numa-rebalancing = ["adaptive-parallel"]  # NUMA load balancing
nightly-adaptive = ["nightly", "portable_simd", "nightly-atomic", "dep:num_cpus"]  # 20-40% improvement
progress-ratatui = ["std", "dep:ratatui"]  # T1 Atomic: Ratatui TUI adapter for BatchProgressRenderer
terminal-size = ["dep:terminal_size"]  # T1 Atomic: TerminalCapabilityCapsule (terminal detection, optional dependency)

# T5: Streaming (O(1) incremental compute)
streaming = ["std"]  # T5 Streaming tier (foundation)
streaming-sync = ["streaming"]  # Synchronous streaming primitives
streaming-async = ["tokio-compat", "streaming"]  # Async streaming with tokio (requires tokio-compat)
streaming-strategy-labeler = ["streaming"]  # T5 Strategy labeling capsule (moved from kindly_hft)
ring-trace = ["std"]  # T5 Ring Buffer Capsule (generic, <10ns append, 100% lockfree) - migrated from atomic_debugger
json5 = ["std"]  # T5 JSON5 Parser Capsule (extends JsonParserCapsule with comments, trailing commas, unquoted keys, <100ns/token)
yaml = ["std"]  # T5 YAML Writer/Parser Capsule (<100ns per field, simplified YAML 1.2 subset, no anchors/aliases)
async-log = ["tokio-compat"]  # T5 async log (10-100× vs Mutex<File>, requires tokio-compat)
logging = ["std", "dep:once_cell"]  # T0+T1+T5 Logging Capsules (zero deps, 2× faster than log+env_logger, eliminates format string buffer overflow)

# Async Channels (lockfree async channels replacing tokio::sync)
# T1 Atomic coordination + async/await support
# Performance: <30ns send, <50ns recv, 10M+ msg/sec
async-channels = ["std", "async-mpsc", "async-oneshot", "async-broadcast", "async-watch"]  # All async channel implementations
async-mpsc = ["std"]  # T1+T4: Multi-producer single-consumer channel (bounded/unbounded)
async-oneshot = ["std"]  # T1: Single-value one-shot channel (zero allocation)
async-broadcast = ["std"]  # T1+T4: Multi-producer multi-consumer broadcast (extends RingBufferBroadcast)
async-watch = ["std"]  # T1: Latest-value watch channel (SeqLock pattern)

# T6: Mixed Composites (50-100× compound speedup)
composite-capsules = ["portable_simd", "fixed-point"]  # Enable composite capsules
tier1-tier2 = ["portable_simd"]  # Atomic + SIMD (12× compound)
tier1-tier3 = ["fixed-point"]  # Atomic + Fixed-Point (6× compound)
tier2-tier3 = ["portable_simd", "fixed-point"]  # SIMD + Fixed-Point (8× compound)
tier1-tier2-tier3 = ["tier1-tier2", "tier2-tier3"]  # Full 3-tier (24× compound)
full-compound = ["tier1-tier2-tier3", "adaptive-parallel"]  # All 4 tiers (T1+T2+T3+T4)
lockfree-executor = ["std"]  # T6 Mixed: 100% lockfree task execution (T1 Atomic + T4 Batch)
wiring-capsule = ["std", "circuit-breaker-standard64"]  # T6 Mixed: Lockfree request/response wiring (T1 Atomic + CircuitBreaker)

# Phase 3: Compression Primitives (T2/T3/T4/T6 multi-tier capsules from kindly_hft)
compression-lz4 = ["std", "dep:lz4_flex", "dep:rayon", "dep:thiserror", "derive"]  # T4 Batch parallel LZ4 decompression (8× speedup)
compression-q4-4 = ["fixed-point", "dep:thiserror", "derive"]  # T3 Fixed-Point Q4.4 quantization (8:1 compression)
compression-simd-parse = ["portable_simd", "dep:thiserror", "derive"]  # T2 SIMD checkpoint parsing (2-4× speedup)
compression-streaming = ["std", "dep:thiserror", "compression-q4-4"]  # T6 Mixed incremental quantization (2× memory)
compression-all = ["compression-lz4", "compression-q4-4", "compression-simd-parse", "compression-streaming"]  # All Phase 3 compression

# T7: GPU Massively Parallel (traits only, 100-1000× speedup)
# No feature flags - GPU traits are always available

# T8: Network (10-50× speedup)
network = ["native", "tokio-compat", "dep:serde", "dep:bincode"]  # Distributed coordination
distributed = ["std", "dep:siphasher", "dep:reqwest", "tokio-compat", "dep:futures", "dep:serde", "dep:serde_json"]  # HTTP/2 cache
distributed-compression = ["distributed", "dep:zstd"]  # zstd compression
distributed-audit = ["distributed"]  # Hash-chained audit trail
distributed-histogram = ["distributed", "dep:hdrhistogram"]  # P50/P95/P99/P999 monitoring
distributed-all = ["distributed-compression", "distributed-audit", "distributed-histogram"]  # All P1 features
remote-attestation = ["native", "tokio-compat", "dep:rustls", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:serde", "dep:serde_json", "dep:hex"]  # T8+T1: Remote license attestation (TLS 1.3 + HTTP/2)

# T9: Persistent (ACID durability)
mmap-persistence = ["std", "dep:memmap2"]  # DEPRECATED: Legacy mmap (use capsule-mmap)
capsule-mmap = ["std"]  # Capsule-native mmap (zero deps, replaces memmap2)
persistent = ["native", "dep:memmap2", "dep:bytemuck", "nightly-atomic"]  # T9 tier (atomic_from_mut required)
persistence-binary-io = ["persistent", "fixed-point-quantizer", "dep:memmap2", "dep:sha2", "dep:anyhow"]  # T9 binary reader/writer (moved from kindly_hft)
persistent-audit = ["persistent"]  # Q34 audit trails
persistent-recovery = ["persistent"]  # Crash recovery patterns
persistent-all = ["persistent", "persistent-audit", "persistent-recovery"]  # All T9 features
encrypted-state = ["std", "dep:memmap2", "dep:aes-gcm", "dep:sha2", "dep:hmac", "dep:hkdf", "derive"]  # T9+T0: Encrypted persistent state with AES-256-GCM
memory-encryption = ["std", "dep:sha2", "derive"]  # T9+Platform: SGX/SEV-SNP/Secure Enclave memory encryption (fallback: mlock+mprotect)
sgx-enclave = ["memory-encryption"]  # Intel SGX enclave support (requires sgx_tstd)
sev-snp = ["memory-encryption"]  # AMD SEV-SNP support (requires sev crate)
secure-enclave = ["memory-encryption"]  # macOS Secure Enclave support (requires security-framework)
tpm-binding = ["std", "dep:tss-esapi", "dep:sha2"]  # T9+Platform: TPM 2.0 hardware binding (Linux/Windows)
tpm-binding-macos = ["std", "dep:security-framework"]  # T9+Platform: Secure Enclave hardware binding (macOS)

# T10: Probabilistic (100-1000× speedup)
probabilistic = ["std"]  # MinHash, HyperLogLog, Bloom filter, Count-Min sketch
bloom-filter = ["probabilistic", "hll"]  # T10.2 Bloom filter (requires SipHash from hll)
bloom-filter-simd = ["bloom-filter", "portable_simd"]  # SIMD hash acceleration (5.95× speedup)
bloom-filter-persistent = ["bloom-filter", "mmap-persistence", "nightly-atomic"]  # T9+T10 persistent
bloom-filter-all = ["bloom-filter-simd", "bloom-filter-persistent"]  # All bloom features
count-min-sketch = ["probabilistic"]  # T10.1 frequency counting
count-min-simd = ["count-min-sketch", "portable_simd"]  # SIMD hash (4× speedup)
hll = ["probabilistic", "dep:siphasher"]  # HyperLogLog cardinality estimation
hll-simd = ["hll", "portable_simd"]  # SIMD-accelerated HLL merge (8-16× faster)
hll-sharded = ["hll"]  # Sharded HLL for >64 threads
anomaly-detection = ["std", "bloom-filter", "hll", "fixed-point"]  # T10+T1 Anomaly detector (Bloom + HLL + EMA)

# TIER 4: Nightly Features (cutting-edge optimizations)
# #ASSUME_NIGHTLY_FEATURES: All nightly features are optional and feature-gated
# #VERIFY_NIGHTLY: CI validates on both stable (graceful degradation) and nightly
nightly = []  # Enable nightly features (portable_simd, const_fn_floating_point)
portable_simd = ["nightly"]  # SIMD capsule primitives (requires nightly)
nightly-prefetch = ["nightly"]  # Hardware prefetch optimization (5-10% at 75% load)
nightly-all = ["nightly", "const-hashing", "simd-hashing", "const-serialize", "const-float", "nightly-prefetch", "queue-bounded"]  # All nightly optimizations

# TIER 5: Convenience Presets (simplify common configurations)
# #ASSUME_PRESET_EXCLUSIVE: Choose ONE preset per build
# #VERIFY_PRESET: Presets are mutually exclusive (documented)
preset-wasm = ["wasm", "simd-stable-wasm", "fixed-point", "probabilistic"]  # WASM stable
preset-wasm-nightly = ["wasm", "simd-nightly-wasm", "fixed-point", "probabilistic", "nightly"]  # WASM nightly
preset-native = ["native", "simd-native", "persistent", "network", "streaming-async", "probabilistic", "histogram"]  # Native full
preset-embedded = ["embedded", "fixed-point"]  # Embedded minimal
preset-capsule-os = ["capsule-os", "simd-native", "fixed-point"]  # Capsule OS future

# TIER 6: Auditable Hash Features (Tier 0 dual-hash architecture)
# #ASSUME_FEATURE_GATED: All crypto code behind audit-trail feature
fast-hash = ["dep:xxhash-rust"]  # Fast non-cryptographic hashing (xxHash64)
audit-trail = ["fast-hash", "dep:blake3"]  # Production audit trails (xxHash64 + BLAKE3)
highway-hash = ["dep:highway"]  # High-performance SIMD hashing (2-4× faster)
fips-compliant = ["audit-trail", "dep:sha2"]  # FIPS 140-2 compliance (SHA-256)
keyed-hashing = ["fips-compliant", "std"]  # HMAC-based keyed hashing
crypto-license = ["std", "dep:ed25519-dalek", "derive"]  # Ed25519 signature-based licensing (T1 Atomic + Ed25519)

# TIER 7: Feature Presets (optimized combinations)
profile-development = ["fast-hash"]  # Development: Fast hash only (+8KB, <5ns)
profile-production = ["fast-hash", "audit-trail"]  # Production: Audit trail (+23KB, <100ns)
profile-highway = ["highway-hash", "fast-hash"]  # High-performance: HighwayHash (2-4× faster)
profile-government = ["fips-compliant"]  # Regulated: FIPS compliance (+50KB, <200ns)
profile-high-performance = ["nightly", "simd-hashing", "const-hashing", "highway-hash"]  # Nightly: All optimizations

# TIER 8: Inference Primitives (NIGHTLY-FIRST per IMPL-2 V3.1)
inference-primitives = ["portable_simd", "std"]  # Base inference (REQUIRES nightly)
inference-matmul = ["inference-primitives", "dep:rayon"]  # T2+T4 matmul
inference-attention = ["inference-primitives"]  # T2+T5 flash attention
inference-quantization = ["inference-primitives", "fixed-point"]  # T3 Q8/Q16
inference-avx2-quant = ["inference-primitives"]  # T2 custom AVX2 intrinsics (10-20× target)
inference-all = ["inference-matmul", "inference-attention", "inference-quantization", "inference-avx2-quant"]  # All inference

# TIER 9: CNLS Quantum Wave Mechanics (T2+T3+T6)
complex-simd = ["portable_simd"]  # T2 ComplexF32x4 (10-13× speedup)
cnls = ["complex-simd", "complex-fixed", "capsule-serialize"]  # CNLS solver with audit trails
split-step-fourier = ["cnls", "dep:rustfft"]  # Split-Step Fourier method
quantum-wave = ["cnls", "split-step-fourier"]  # Complete quantum wave mechanics suite

# TIER 10: Data Protection (T6 Mixed: T0+T1+T9)
data-protection = ["std", "const-hashing", "audit-trail", "capsule-serialize"]  # T6 data protection
cli = ["data-protection", "dep:clap", "dep:anyhow", "dep:glob"]  # Data protection CLI
orchestrator = ["std"]  # T6 Mixed: 11-layer protection orchestration (lockfree coordination)
runtime-integrity = ["std", "dep:sha2"]  # T0+T1: Runtime integrity verification with hash-chained code regions (Phase 12B)
runtime-reactor = ["std"]  # T1: Lockfree I/O reactor (epoll/kqueue, replaces Tokio reactor)
runtime-signal = ["std", "runtime-reactor", "async-channels", "tokio-compat"]  # T1: Lockfree async signal handling (signalfd/kqueue/self-pipe, multi-listener support)
runtime-executor = ["std"]  # T6: Lockfree task executor (WIP)
runtime-net = ["std", "runtime-reactor"]  # T1+T8: Lockfree async UDP networking (Phase 1: basic async UDP)
unix-socket = ["std"]  # T1+T5: Lockfree Unix domain sockets (Docker-critical SCM_RIGHTS FD passing)
runtime-process = ["std"]  # T1+T5: Lockfree async process spawning (posix_spawn + pidfd, 5-20× vs tokio::process)
kind-tcp = ["std"]  # Kind module: AsyncTcpListener + AsyncTcpStream (lockfree TCP, <100ns accept/connect)

# TIER 11: Unified Traits (backward compatible)
unified-traits = []  # Enable unified capsule trait hierarchy (opt-in)

# TIER 12: Derive Macro (automatic verification)
derive = ["dep:atomic_capsule_derive"]  # Enable automatic verification via derive macro

# TIER 13: Stable Fallback (for nightly features)
stable-fallback = []  # Fallback implementation (stable Rust only)

# TIER 14: CRC32Fast (temporary compatibility)
crc32fast = ["dep:crc32fast"]

# TIER 15: Internal Features (do not use directly)
auto_tune = []  # Internal feature: Enable auto-tuning infrastructure
parking_lot = ["dep:parking_lot"]

# TIER 16: Training Data Migration (combined feature for all 4 capsules)
training-data = ["fixed-point-quantizer", "streaming-strategy-labeler", "persistence-binary-io"]  # All training data capsules

[dependencies]
# ZERO dependencies for core functionality (no_std compatible)
atomic_capsule_derive = { path = "../atomic_capsule_derive", optional = true }

# Tier 0 Auditable - Optional cryptographic dependencies
xxhash-rust = { version = "0.8", features = ["xxh64"], optional = true }
blake3 = { version = "1.8", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
highway = { version = "1.2", optional = true }
ed25519-dalek = { version = "2.1", optional = true }  # Ed25519 signatures for CryptoLicenseCapsule

# Cache Module - SipHash + optional HMAC/AES-GCM
siphasher = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }

# Encrypted State - HKDF key derivation
hkdf = { version = "0.12", optional = true }

# Fuzzy Extractor - Reed-Solomon error correction for PUF stability
libc = { version = "0.2", optional = true }
reed-solomon-erasure = { version = "6.0", optional = true }

# Tier 5 Streaming - Async log
tokio = { version = "1.0", features = ["rt", "fs", "io-util", "time", "net", "macros"], optional = true }
once_cell = { version = "1.19", optional = true }  # For logging module global state

# T8 Network - RPC serialization
bincode = { version = "1.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hex = { version = "0.4", optional = true }
reqwest = { version = "0.12", features = ["json", "http2"], optional = true }
futures = { version = "0.3", optional = true }

# T8 Remote Attestation - TLS 1.3 + HTTP/2
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
hyper = { version = "1.0", optional = true, features = ["client", "http2"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http2", "ring", "native-tokio"] }
hyper-util = { version = "0.1", optional = true, features = ["client", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1.0", optional = true }

# Distributed Cache - P1 dependencies
zstd = { version = "0.13", optional = true }
hdrhistogram = { version = "7.5", optional = true }

# Serialization
crc32fast = { version = "1.5.0", optional = true }
crc = { version = "3.2", optional = true }

# Tier 9 Persistent - Memory-mapped files
memmap2 = { version = "0.9", optional = true }
bytemuck = { version = "1.14", optional = true, features = ["derive"] }

# Phase 9: Nightly Adaptive - Topology detection
num_cpus = { version = "1.16", optional = true }

# Phase 2: Inference Primitives - Batch parallelism
rayon = { version = "1.8", optional = true }

# Phase 3: Compression Primitives - LZ4 decompression
lz4_flex = { version = "0.11", optional = true }
thiserror = { version = "2.0", optional = true }

# Phase 4.2: Split-Step Fourier Method
rustfft = { version = "6.2", optional = true }

# T4: Text Processing - Thread-local tokenization buffers (13× speedup)
thread_local = { version = "1.1", optional = true }
hashbrown = { version = "0.14", optional = true }

# CLI Binary Dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }

# TUI Dependencies
ratatui = { version = "0.29", optional = true }
glob = { version = "0.3", optional = true }
terminal_size = { version = "0.3", optional = true }  # TerminalCapabilityCapsule size detection

# Circuit Breaker - Optional dependencies
perfcnt = { version = "0.8", optional = true }

# Monitoring Dashboard - Timestamp formatting
chrono = { version = "0.4", optional = true }

# WASM target - wasm-bindgen for std support
wasm-bindgen = { version = "0.2", optional = true }
parking_lot = { version = "0.12", optional = true }

# TPM 2.0 Hardware Binding - Platform-specific
# Platform-specific dependencies
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tss-esapi = { version = "7.5", optional = true, default-features = false }  # TPM 2.0 bindings (TCG Software Stack)

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "2.9", optional = true }  # Secure Enclave bindings (macOS)

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = false }  # Required for RT priority on Linux

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
trybuild = "1.0"
parking_lot = "0.12"
serial_test = "3.0"
loom = "0.7"
rayon = "1.8"
dashmap = "6.1.0"
rand = "0.8"
rand_distr = "0.4"
tempfile = "3.8"
hdrhistogram = "7.5"
httparse = "1.9"
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }

[lib]
name = "atomic_capsule"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]  # Support both Rust and C FFI

