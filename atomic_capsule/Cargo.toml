proptest = "1.5"
trybuild = "1.0"
parking_lot = "0.12"
serial_test = "3.0"
loom = "0.7"
rayon = "1.8"
dashmap = "6.1.0"
rand = "0.8"
rand_distr = "0.4"
tempfile = "3.8"
hdrhistogram = "7.5"
httparse = "1.9"
wasm-bindgen-test = "0.3"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }

