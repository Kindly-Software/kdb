[workspace]
[package]
name = "atomic_capsule_derive_serialize"
version = "0.1.0"
edition = "2021"
authors = ["Samuel <samuel@kindly.ai>"]
description = "Procedural macro for automatic fixed-point serialization in computational capsules"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
# Compile-pass/fail tests
trybuild = "1.0"

# Integration testing
atomic_capsule = { path = "../atomic_capsule", features = ["std", "capsule-serialize"] }

[features]
default = []

# Enable detailed error messages with span information
verbose-errors = []
